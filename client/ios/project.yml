# XcodeGen: `brew install xcodegen && xcodegen` writes Trommi.xcodeproj from this file.
name: Trommi
options:
  bundleIdPrefix: com.trommi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Swift 5 language mode with the default (minimal) concurrency checking: the same
    # mode Package.swift builds Core and Net in.
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Trommi:
    type: application
    platform: iOS
    sources:
      # Info.plist is named by INFOPLIST_FILE below; it must not also be copied as a resource.
      - path: Trommi
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trommi.app
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Only what cannot be said as a build setting lives in Info.plist (App Transport Security).
        INFOPLIST_FILE: Trommi/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Trommi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app uses only the system's TLS: no export compliance question per TestFlight build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "To dictate messages to your agents."
        INFOPLIST_KEY_NSCameraUsageDescription: "To scan the QR code with the link to your Trommi server."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Trommi connects to your server on the local network."
  TrommiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TrommiTests
    dependencies:
      - target: Trommi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trommi.app.tests
  TrommiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TrommiUITests
    dependencies:
      - target: Trommi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trommi.app.uitests
schemes:
  Trommi:
    build:
      targets:
        Trommi: all
        TrommiTests: [test]
        TrommiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TrommiTests
        - TrommiUITests
