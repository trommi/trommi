<script>
// Theme before first paint: hash flag, then the remembered choice, else light.
(function () {
  var flags = location.hash.slice(1).split(',')
  var theme = 'light'
  try { if (localStorage.getItem('agent-board-theme') === 'dark') theme = 'dark' } catch (e) {}
  if (flags.indexOf('dark') >= 0) theme = 'dark'
  if (flags.indexOf('light') >= 0) theme = 'light'
  if (theme === 'dark') document.documentElement.dataset.theme = 'dark'
})()
</script>

<body data-view="chat" data-scope="all">
<script>
// What the page shows, before first paint: the address says it, or an old hash flag.
(function () {
  var flags = location.hash.slice(1).split(',')
  var parts = location.pathname.split('/').filter(Boolean)
  var data = document.body.dataset
  if (parts[0] === 'agents') data.page = 'roster'
  if (parts[0] === 's' && parts[1]) {
    data.scope = parts[1]
    if (parts[2] === 'scribble') data.view = 'scribble'
    if (parts[2] === 'questions' || parts[2] === 'files') data.filter = parts[2]
  } else {
    if (flags.indexOf('scribble') >= 0) data.view = 'scribble'
    if (flags.indexOf('decisions') >= 0) data.filter = 'questions'
  }
})()
</script>

<header class="topbar">
  <!-- The logo is the menu (js/bar.js): Help, Admin, Keys, the knock sound, the theme, and the connection. -->
  <div class="brand">
    <!-- Places are real links (js/link.js): the Desk, Agents. A plain click stays in the page.
         The Desk floats at the top centre (a phone: in the bar): a click goes to the Desk; the caret beside it
         opens the menu. What waits and who works stands in #desk-state (js/agents.js). -->
    <h1 class="deskpill">
      <a href="/" data-nav draggable="false" class="desk-go" id="desk-go" title="Desk: everything that waits for you (G I)">
      <!-- The mark: a counter bell with two ring strokes, drawn in the pen of the session marks (css/logo.css). -->
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3.1 19Q12.3 18.6 16.7 19L21 19.3"/>
        <path d="M4.8 18.9Q5.2 15.1 5.7 13.7Q6.2 12.3 7.5 11.3Q8.7 10.3 10.3 9.5Q12 8.8 13.7 9.3Q15.3 9.8 16.4 11Q17.5 12.2 18.1 13.7Q18.6 15.2 18.8 17L18.9 18.8"/>
        <path d="M11.8 8.6L12.2 6.9"/>
        <path d="M10 6.6Q11.8 6 12.8 6.4L13.8 6.8"/>
        <path class="brand-mark-ring" d="M18.5 7.3Q19.5 5.8 19.8 5.2L20 4.5"/>
        <path class="brand-mark-ring" d="M20.6 10.3Q21.5 9.4 22.3 8.9L23.1 8.5"/>
      </svg>
        <span class="desk-name">Desk</span>
        <span class="desk-state" id="desk-state"></span>
      </a>
      <button type="button" class="brand-open" id="brand-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="brand-doors" aria-label="Menu: jump, desks, places, settings" title="Jump, desks, Agents, Help, Admin, Keys, theme"></button>
    </h1>
    <nav class="sidedoors" id="brand-doors" role="menu" aria-label="Jump, places and settings" hidden>
      <!-- Jump: type to go to a session, a question by its number, the inbox, the agents, the pad. -->
      <label class="jump-box"><input id="jump-field" type="search" placeholder="Session, number, Desk…" aria-label="Jump to a session, a question number or a place" aria-keyshortcuts="Control+K Meta+K" autocomplete="off" spellcheck="false"><kbd id="jump-key">Ctrl K</kbd></label>
      <div id="jump-results" role="listbox" aria-label="Places"></div>
      <!-- Desks (a desk is what was called a project): one today; the list takes more. -->
      <p class="menu-head">Switch desk</p>
      <div class="menu-desks" id="desk-list">
        <button role="menuitemradio" type="button" class="menu-desk" id="project-current" aria-checked="true"><b>Trommi</b><i id="desk-open"></i></button>
      </div>
      <div class="menu-grid">
        <a role="menuitem" href="/agents" data-nav draggable="false" id="menu-agents">Agents</a>
        <a role="menuitem" href="/help.html">Help</a>
        <a role="menuitem" href="/admin.html">Admin</a>
        <button role="menuitem" type="button" id="keys-open" aria-haspopup="dialog" aria-keyshortcuts="?"><span>Keys</span></button>
      </div>
      <!-- The foot: the connection, and two small switches. -->
      <div class="menu-foot">
        <p class="conn" id="conn" data-state="connecting" role="status"><i aria-hidden="true"></i><span id="conn-text">Connecting</span></p>
        <button role="menuitemcheckbox" type="button" id="knock-sound" aria-checked="false" aria-label="Knock sound" title="Knock sound: a soft double knock when an urgent question arrives"></button>
        <button role="menuitemcheckbox" type="button" id="theme-toggle" aria-label="Switch to the dark theme" aria-pressed="false"></button>
      </div>
    </nav>
  </div>
  <!-- Where to go; at the right end only the pad's control (put before #focus-open by js/padlink.js). -->
  <nav class="footnav" aria-label="Places">
    <button type="button" id="nav-inbox">Desk</button>
    <button type="button" id="nav-roster">Agents</button>
  </nav>
  <a href="/agents" data-nav draggable="false" class="icon-btn roster-open" id="roster-open" aria-label="Agents" title="Agents"></a>
  <!-- No Focus button in the bar: the walk starts at the count beside "Inbox", at a session's badge, and with G F.
       The element stays, hidden, as the place the pad's control is put before and for the page's own wiring. -->
  <button type="button" class="focus-open" id="focus-open" hidden aria-label="Focus: every open question as a page of its own"><span>Focus</span></button>
</header>

<nav id="agents" aria-label="Desk and sessions"></nav>

<main id="inbox" aria-label="Desk"></main>


<main id="session" aria-label="Session">
<header class="pane-title">
  <div class="pane-who" id="pane-who"></div>
  <!-- Filters lay a list over the conversation: its questions only, or everything it sent. Real links
       (js/link.js; app.js paintLinks keeps their addresses): a plain click stays in the page. -->
  <nav class="filters" aria-label="Filter the conversation">
    <a href="/" data-nav id="filter-questions" aria-pressed="false">Questions only<b id="filter-count"></b></a>
    <a href="/" data-nav id="filter-files" aria-pressed="false">Files</a>
  </nav>
  <nav class="modes" aria-label="View of the session">
    <a href="/" data-nav id="mode-chat" data-view="chat">Conversation</a>
    <a href="/" data-nav id="mode-scribble" data-view="scribble">Scribble</a>
  </nav>
</header>

<section id="chat" aria-label="Conversation">
  <div class="chat-pane">
    <div class="chat-body">
      <div class="log">
        <div class="column log-inner">
          <div class="skeleton" aria-hidden="true">
            <span class="sk sk-bubble"></span>
            <span class="sk sk-head"></span>
            <span class="sk sk-line"></span>
            <span class="sk sk-line sk-w80"></span>
            <span class="sk sk-line sk-w55"></span>
            <span class="sk sk-event"></span>
            <span class="sk sk-head"></span>
            <span class="sk sk-line sk-w80"></span>
            <span class="sk sk-line sk-w40"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="scribble" aria-label="Scribble"></section>
</main>

<nav class="tabbar" aria-label="View">
  <a href="/" data-nav id="tab-chat" data-view="chat">
    <span class="tab-ico">
