<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>Trommi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231b6a57'/%3E%3Crect x='7' y='11' width='18' height='14' rx='3.5' fill='%23fff' opacity='.45'/%3E%3Crect x='7' y='7' width='18' height='14' rx='3.5' fill='%23fff'/%3E%3Cpath d='M11.5 14.2l2.6 2.6 5-5.2' fill='none' stroke='%231b6a57' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
// Theme before first paint: hash flag, then the remembered choice, else light.
(function () {
  var flags = location.hash.slice(1).split(',')
  var theme = 'light'
  try { if (localStorage.getItem('agent-board-theme') === 'dark') theme = 'dark' } catch (e) {}
  if (flags.indexOf('dark') >= 0) theme = 'dark'
  if (flags.indexOf('light') >= 0) theme = 'light'
  if (theme === 'dark') document.documentElement.dataset.theme = 'dark'
  // A test, one switch on <html> (styles in app.css): data-grouploop="all" draws the loop round a group
  // in the sidebar round marks and names; anything else round the marks alone. The flag #loop-all turns it on.
  document.documentElement.dataset.grouploop = flags.indexOf('loop-all') >= 0 ? 'all' : 'marks'
})()
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/scribble.css">
<link rel="stylesheet" href="/css/focus.css">
<link rel="stylesheet" href="/css/speech.css">
<link rel="stylesheet" href="/css/keys.css">
<link rel="stylesheet" href="/css/padlink.css">
<link rel="stylesheet" href="/css/back.css">
<link rel="stylesheet" href="/css/stack.css">
<link rel="stylesheet" href="/css/table.css">
<script src="/js/layout-boot.js"></script>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/padlink.js"></script>
<script type="module" src="/js/bar.js"></script>
<script type="module" src="/js/stack.js"></script>
</head>
<body data-view="chat" data-scope="all">
<script>
// What the page shows, before first paint: the address says it, or an old hash flag.
(function () {
  var flags = location.hash.slice(1).split(',')
  var parts = location.pathname.split('/').filter(Boolean)
  var data = document.body.dataset
  if (parts[0] === 'agents') data.page = 'roster'
  if (parts[0] === 's' && parts[1]) {
    data.scope = parts[1]
    if (parts[2] === 'scribble') data.view = 'scribble'
    if (parts[2] === 'questions' || parts[2] === 'files') data.filter = parts[2]
  } else {
    if (flags.indexOf('scribble') >= 0) data.view = 'scribble'
    if (flags.indexOf('decisions') >= 0) data.filter = 'questions'
  }
})()
</script>

<header class="topbar">
  <!-- The logo is a door: Help and Admin open from it (js/bar.js). -->
  <div class="brand">
    <h1><button type="button" class="brand-open" id="brand-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="brand-doors" title="Help, Admin">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect class="brand-mark-bg" width="32" height="32" rx="9"/>
        <rect class="brand-mark-back" x="7" y="11" width="18" height="14" rx="3.5"/>
        <rect class="brand-mark-front" x="7" y="7" width="18" height="14" rx="3.5"/>
        <path class="brand-mark-tick" d="M11.5 14.2l2.6 2.6 5-5.2"/>
      </svg>
      <span>Trommi</span>
    </button></h1>
    <nav class="sidedoors" id="brand-doors" role="menu" aria-label="Help and administration" hidden>
      <a role="menuitem" href="/help.html">Help</a>
      <a role="menuitem" href="/admin.html">Admin</a>
      <button role="menuitemcheckbox" type="button" id="knock-sound" aria-checked="false">Knock sound</button>
    </nav>
  </div>
  <!-- Where to go; then the two tools (the pad's control is put before Focus by js/padlink.js); then the state. -->
  <nav class="footnav" aria-label="Places">
    <button type="button" id="nav-inbox">Inbox</button>
    <button type="button" id="nav-roster">Agents</button>
  </nav>
  <button class="icon-btn roster-open" id="roster-open" type="button" aria-label="Agents" title="Agents">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11.200a3.100 3.100 0 1 0 0-6.200 3.100 3.100 0 0 0 0 6.200zM3.500 19c.3-3.200 2.500-5 5.500-5s5.200 1.800 5.500 5M15.500 5.300a3 3 0 0 1 0 5.700M17.300 14.300c1.900.7 3 2.300 3.200 4.700"/></svg>
  </button>
  <button type="button" class="focus-open" id="focus-open" aria-label="Focus: every open question as a page of its own">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5.500A1.500 1.500 0 0 1 5.500 4H9M15 4h3.500A1.500 1.500 0 0 1 20 5.500V9M20 15v3.500a1.500 1.500 0 0 1-1.500 1.500H15M9 20H5.500A1.500 1.500 0 0 1 4 18.500V15"/></svg>
    <span>Focus</span>
  </button>
  <p class="conn" id="conn" data-state="connecting" role="status"><i aria-hidden="true"></i><span id="conn-text">Connecting</span></p>
  <button class="icon-btn" id="keys-open" type="button" aria-haspopup="dialog" aria-keyshortcuts="?" aria-label="Keys: what the keyboard does here" title="Keys (?)"></button>
  <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to the dark theme" aria-pressed="false">
    <svg class="ico ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.500 10.500z"/></svg>
    <svg class="ico ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.500v2M12 19.500v2M2.500 12h2M19.500 12h2M5.300 5.300l1.400 1.400M17.300 17.300l1.400 1.400M5.300 18.700l1.400-1.400M17.300 6.700l1.400-1.400"/></svg>
  </button>
</header>

<nav id="agents" aria-label="Inbox and sessions"></nav>

<main id="inbox" aria-label="Inbox"></main>

<main id="roster" aria-label="Agents"></main>

<main id="session" aria-label="Session">
<header class="pane-title">
  <div class="pane-who" id="pane-who"></div>
  <!-- Filters lay a list over the conversation: its questions only, or everything it sent. -->
  <nav class="filters" aria-label="Filter the conversation">
    <button type="button" id="filter-questions" aria-pressed="false">Questions only<b id="filter-count"></b></button>
    <button type="button" id="filter-files" aria-pressed="false">Files</button>
  </nav>
  <nav class="modes" aria-label="View of the session">
    <button type="button" id="mode-chat" data-view="chat">Conversation</button>
    <button type="button" id="mode-scribble" data-view="scribble">Scribble</button>
  </nav>
</header>

<section id="chat" aria-label="Conversation">
  <div class="chat-pane">
    <div class="chat-body">
      <div class="log">
        <div class="column log-inner">
          <div class="skeleton" aria-hidden="true">
            <span class="sk sk-bubble"></span>
            <span class="sk sk-head"></span>
            <span class="sk sk-line"></span>
            <span class="sk sk-line sk-w80"></span>
            <span class="sk sk-line sk-w55"></span>
            <span class="sk sk-event"></span>
            <span class="sk sk-head"></span>
            <span class="sk sk-line sk-w80"></span>
            <span class="sk sk-line sk-w40"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="scribble" aria-label="Scribble"></section>
</main>

<nav class="tabbar" aria-label="View">
  <button type="button" id="tab-chat" data-view="chat">
    <span class="tab-ico">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a7.500 7.500 0 0 1-11 6.600L4 20l1.400-4.600A7.500 7.500 0 1 1 20 12z"/></svg>
      <i class="tab-dot" id="chat-dot" hidden></i>
    </span>
    <span>Conversation</span>
  </button>
  <button type="button" id="tab-scribble" data-view="scribble">
    <span class="tab-ico">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20c2.500-1 3-3.500 4.500-5.500S12 11 13.500 12s-1 4 .500 5 3.500-2 6-2.500M15.500 4.500l4 4L11 17l-4.500.500L7 13z"/></svg>
    </span>
    <span>Scribble</span>
  </button>
</nav>

<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
