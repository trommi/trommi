<script>
  if (location.hash.slice(1).split(',').indexOf('dark') >= 0) document.documentElement.dataset.theme = 'dark'
</script>

  #pv-log { position: fixed; left: 8px; bottom: 8px; z-index: 2147483600; max-width: 90vw; padding: 6px 10px; border-radius: var(--r-sm); background: var(--urg-critical); color: var(--surface); font: 500 var(--t-xs)/1.4 var(--mono); white-space: pre-wrap; }
  #pv-log:empty { display: none; }

<script>
  // errors go on screen so a screenshot shows them
  const pvLog = msg => { document.getElementById('pv-log').textContent += msg + '\n' }
  window.onerror = (msg, src, line, col) => pvLog(`${msg} @ ${String(src).split('/').pop()}:${line}:${col}`)
  window.addEventListener('unhandledrejection', e => pvLog(`unhandled: ${e.reason?.message ?? e.reason}`))
</script>
<script type="module">
// Workbench for the Focus window. It feeds the store directly and stands in
// for the server on /decide and /reopen. Hash flags (comma separated) put the
// page straight into a state for screenshots:
//   dark            theme
//   closed          do not open the window on load
//   card=<id>       open on that card: c-perm c-migrate c-phone c-video c-theme c-next c-yesno c-duo c-long c-six c-multi
//   walk            the walk ("Go through them one by one"); with card=<id> it starts there.
//                   Without walk, card=<id> is the window of that one card ("More" on a row).
//   fail            answers fail; the first tile is tapped so the message shows
//   thread          the card in front has been asked back about, and the agent has replied
//   ask             a question is typed into the ask-back field and sent (askfail: it fails)
//   picked          on c-multi, two options are switched on
//   undo            one question is answered in the walk so "Undo" shows
//   hint            a more urgent question arrives while one is in front
//   gone            the question in front is answered elsewhere
//   zoom            the first image is enlarged
//   many            fourteen cards
//   say             the server offers speech, so the read-aloud switch shows (sayon: switched on,
//                   saying / sayload: as while it plays / loads)
//   done            nothing is open
//   solo            a single agent, so no card names who is asking
//   longnames       sessions with long names, to see the top bar give way
// The same things are scriptable through window.pv (see the bottom of this file).
import { setState, getState } from '/js/store.js'
import { mountFocus } from '/js/focus.js'

const flags = decodeURIComponent(location.hash.slice(1)).split(',').map(f => f.trim()).filter(Boolean)
const has = f => flags.includes(f)
const flagValue = name => flags.find(f => f.startsWith(name + '='))?.slice(name.length + 1)

const fill = document.getElementById('pv-fill')
for (let i = 0; i < 14; i++) fill.append(Object.assign(document.createElement('p'), { textContent: `The page behind the window, paragraph ${i + 1}. It must neither scroll nor take input while Focus is open.` }))

const RANK = { critical: 3, high: 2, normal: 1, low: 0 }
const min = 60000
const now = Date.now()
const img = name => ({ name, url: `/files/${name}`, image: true, kind: 'image' })

/** A two-second clip drawn on a canvas, so the workbench needs no video file. */
async function makeClip() {
  try {
    const canvas = Object.assign(document.createElement('canvas'), { width: 640, height: 360 })
    const ctx = canvas.getContext('2d')
    const stream = canvas.captureStream(24)
    const rec = new MediaRecorder(stream, { mimeType: 'video/webm' })
    const chunks = []
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data) }
    const stopped = new Promise(r => { rec.onstop = r })
    rec.start()
    const t0 = performance.now()
    const draw = () => {
      const t = (performance.now() - t0) / 1000
      ctx.fillStyle = '#10201b'; ctx.fillRect(0, 0, 640, 360)
      ctx.fillStyle = '#1b6a57'; ctx.fillRect(40, 60, 560, 44)
      ctx.fillStyle = '#dcefe8'
      for (let i = 0; i < 3; i++) ctx.fillRect(40, 130 + i * 62, 560 * Math.min(1, Math.max(0, t * 1.4 - i * 0.3)), 44)
      ctx.fillStyle = '#ffffff'; ctx.font = '600 22px sans-serif'; ctx.fillText('The list fading in', 56, 90)
      ctx.beginPath(); ctx.arc(80 + t * 240, 330, 10, 0, 7); ctx.fill()
    }
    draw()
    const timer = setInterval(draw, 40)
    await new Promise(r => setTimeout(r, 900))
    clearInterval(timer)
    rec.stop()
    await Promise.race([stopped, new Promise(r => setTimeout(r, 500))])
    if (!chunks.length) return null
    return URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }))
  } catch { return null }
}
// The clip is recorded in the background and swapped in when it is ready, so the page never waits for it.
let clipUrl = null

const card = (id, o) => ({
  id, kind: 'decision', status: 'open', urgency: 'normal', urgency_reason: '', body: '', attachments: [],
  agent: 'frontend', choice: null, note: '', summary: '', decided: null, ...o,
})

function freshCards() {
  const cards = [
    card('c-next', {
      title: 'What should I build next?', created: now - 30 * min, urgency: 'low', agent: 'planung',
      body: 'The mobile view is done. Three larger topics are next; I can only finish one of them properly this week.',
      options: [
        { key: 'mehrere-agenten', label: 'Several agents', detail: 'One board for several sessions' },
        { key: 'verschluesselung', label: 'Encryption', detail: 'End to end between browser and agent' },
        { key: 'live-verlauf', label: 'Live activity', detail: 'Shows what the agent is doing right now' },
      ],
    }),
    card('c-theme', {
      title: 'Which default theme?', created: now - 23 * min, urgency: 'normal', agent: 'frontend', recommended: 'system',
      body: 'Both themes are finished. I only need the default for new users.\n\n- **Light** reads better in daylight and matches the landing page\n- **Dark** matches terminal and IDE\n- the choice is kept in `localStorage` and can be changed at any time',
      options: [
        { key: 'hell', label: 'Light', detail: 'Reads better in daylight' },
        { key: 'dunkel', label: 'Dark', detail: 'Matches terminal and IDE' },
        { key: 'system', label: 'Follow the system', detail: 'Goes by the device setting' },
      ],
      attachments: [img('thema-hell.png'), img('thema-dunkel.png')],
    }),
    card('c-video', {
      title: 'Should the list fade in when it loads?', created: now - 18 * min, urgency: 'normal', agent: 'frontend',
      body: 'The clip shows the staggered fade as it is built now. It takes about **240 ms** until the last row.',
      options: [
        { key: 'ja', label: 'Keep it', detail: 'Staggered, 240 ms' },
        { key: 'kurz', label: 'Shorter', detail: 'All rows at once, 120 ms' },
        { key: 'nein', label: 'No animation', detail: '' },
      ],
      attachments: [
        { name: 'list-fade-in.webm', url: clipUrl ?? '/files/list-fade-in.webm', image: false, kind: 'video' },
        { name: 'timings.csv', url: '/files/timings.csv', image: false, kind: 'file' },
      ],
    }),
    card('c-phone', {
      title: 'How should the board start on a phone?', created: now - 15 * min, urgency: 'high', agent: 'frontend',
      urgency_reason: 'I am building the mobile view right now',
      body: 'Only one view fits on a phone screen. The conversation on the left, the questions on the right; the pictures show both variants.',
      options: [
        { key: 'gespraech', label: 'With the conversation', detail: 'Like a chat app' },
        { key: 'entscheidungen', label: 'With the questions', detail: 'Open questions first' },
        { key: 'zuletzt', label: 'Where I left off', detail: 'Remembers the last view' },
      ],
      attachments: [img('phone-gespraech.png'), img('phone-entscheidungen.png')],
    }),
    card('c-migrate', {
      title: 'Run the migration on the production database?', created: now - 4 * min, urgency: 'critical', agent: 'deploy', recommended: 'tonight',
      urgency_reason: 'The deploy waits, every further step depends on it',
      body: 'The migration `2026_10_02_add_urgency` adds a column and backfills **48,210 rows**. Estimated duration: 40 seconds, the table is locked meanwhile.\n\n```\nALTER TABLE cards ADD COLUMN urgency text NOT NULL DEFAULT \'normal\';\n```\n\n- A backup from 06:00 today exists\n- The rollback is tested and takes under a second',
      options: [
        { key: 'run-now', label: 'Run it now', detail: 'Short lock, the deploy goes through afterwards' },
        { key: 'tonight', label: 'Tonight at 02:00', detail: 'No user affected, the deploy waits until tomorrow' },
        { key: 'batch', label: 'In steps, no lock', detail: 'About two hours of work on the script' },
        { key: 'cancel', label: 'Do not run it', detail: 'I take the change back' },
      ],
    }),
    card('c-yesno', {
      title: 'Shall I delete the old drafts?', created: now - 12 * min, urgency: 'normal', agent: 'frontend', recommended: 'ja',
      body: 'The folder `drafts/` holds 14 files nobody has opened since the rebuild.',
      options: [{ key: 'ja', label: 'Yes', detail: '' }, { key: 'nein', label: 'No', detail: '' }],
    }),
    card('c-duo', {
      title: 'Should the deploy go out today?', created: now - 9 * min, urgency: 'high', agent: 'deploy', recommended: 'warten',
      urgency_reason: 'The maintenance window closes at 6 pm',
      body: 'All tests are green. The only open point is the translation of the new settings page.',
      options: [
        { key: 'raus', label: 'Roll out today', detail: 'The translation follows tomorrow as a patch' },
        { key: 'warten', label: 'Not yet', detail: 'Only with the translation done, Monday at the earliest' },
      ],
    }),
    card('c-long', {
      title: 'Keep the legacy export endpoint alive for the two customers who still call it every night?', created: now - 8 * min, urgency: 'low', agent: 'planung', recommended: 'weg',
      body: 'It costs us one cron job and a table nobody else reads.',
      options: [
        { key: 'weg', label: 'Remove it at the end of the quarter', detail: 'Both customers get a migration guide and three reminders before the endpoint answers with 410 Gone' },
        { key: 'bleibt', label: 'Keep it for another year', detail: 'We keep the cron job, the table and the on-call rule for it' },
      ],
    }),
    card('c-six', {
      title: 'Which region for the new replica?', created: now - 7 * min, urgency: 'normal', agent: 'deploy', recommended: 'fra',
      body: 'Latency from the office and price per month differ; all six are available today.',
      options: [
        { key: 'fra', label: 'Frankfurt', detail: '9 ms, 41 € a month' },
        { key: 'ams', label: 'Amsterdam', detail: '14 ms, 39 € a month' },
        { key: 'par', label: 'Paris', detail: '17 ms, 40 € a month' },
        { key: 'lon', label: 'London', detail: '21 ms, 44 € a month' },
        { key: 'hel', label: 'Helsinki', detail: '31 ms, 33 € a month' },
        { key: 'none', label: 'No replica for now', detail: '' },
      ],
    }),
    card('c-multi', {
      title: 'Which browsers should the test run cover?', created: now - 6 * min, urgency: 'normal', agent: 'frontend', multiple: true, recommended: 'chromium',
      body: 'Each one adds about four minutes to a run. Pick every one you want.',
      options: [
        { key: 'chromium', label: 'Chromium', detail: 'The one most people use' },
        { key: 'firefox', label: 'Firefox', detail: '' },
        { key: 'webkit', label: 'WebKit', detail: 'Safari on Mac and iPhone' },
      ],
    }),
    { id: 'c-perm', kind: 'permission', status: 'open', urgency: 'critical', urgency_reason: '', request_id: 'abcde', agent: 'deploy',
      title: 'Permission: Bash', body: 'Run the test suite\n\n{"command":"npm test -- --coverage","timeout":120000}',
      options: [{ key: 'allow', label: 'Allow', detail: '' }, { key: 'deny', label: 'Deny', detail: '' }],
      attachments: [], choice: null, note: '', summary: '', created: now - 1 * min, decided: null },
    card('c-db', {
      title: 'Which database?', status: 'decided', created: now - 95 * min, decided: now - 80 * min, choice: 'pg',
      options: [{ key: 'sqlite', label: 'SQLite', detail: '' }, { key: 'pg', label: 'Postgres', detail: '' }],
    }),
  ]
  if (has('many')) addMany(cards)
  ;[...cards].sort((a, b) => a.created - b.created).forEach((c, i) => { c.number = i + 1 })
  return cards
}

function addMany(cards) {
  for (let i = 0; i < 8; i++) cards.push(card(`c-more-${i}`, {
    title: `Extra question ${i + 1}: which variant?`, created: now - (40 + i) * min, urgency: ['low', 'normal', 'high'][i % 3], agent: 'planung',
    body: 'Only here to make the stack long.',
    options: [{ key: 'a', label: 'Variant A', detail: '' }, { key: 'b', label: 'Variant B', detail: '' }],
  }))
}

// ── the pretend server ──────────────────────────────────────────────────────
let cards = freshCards()
let failing = has('fail')
let serial = 0
let nextNumber = cards.length + 1

// permission cards first, then urgency, then oldest first: the server's rule
const queueOf = list => list.filter(c => c.status === 'open')
  .sort((a, b) => (b.kind === 'permission') - (a.kind === 'permission') || RANK[b.urgency] - RANK[a.urgency] || a.created - b.created)
  .map(c => c.id)
// The store derives each card's agent_name from this list; with a single agent it stays empty.
const agents = has('solo')
  ? [{ id: 'frontend', name: 'Agent', online: true }]
  : has('longnames')
    ? [{ id: 'frontend', name: 'Web-Frontend Redesign', online: true }, { id: 'deploy', name: 'Infrastructure and Deploy', online: true }, { id: 'planung', name: 'Planning for the next quarter', online: false }]
    : [{ id: 'frontend', name: 'Frontend', online: true }, { id: 'deploy', name: 'Deploy', online: true }, { id: 'planung', name: 'Planning', online: false }]
let messages = []
const push = () => setState({ agents, messages: structuredClone(messages), cards: structuredClone(has('solo') ? cards.map(c => ({ ...c, agent: 'frontend' })) : cards), queue: queueOf(cards), tasks: [], speech: ['say', 'sayon', 'saying', 'sayload'].some(has) })
const find = id => cards.find(c => c.id === id)
const reply = (status, body) => new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } })
const sleep = ms => new Promise(r => setTimeout(r, ms))

const realFetch = window.fetch.bind(window)
window.fetch = async (url, init) => {
  const path = new URL(String(url), location.href).pathname
  if (path !== '/decide' && path !== '/reopen' && path !== '/message') return realFetch(url, init)
  const body = JSON.parse(init?.body ?? '{}')
  await sleep(450)
  const c = find(body.card_id)
  if (path === '/message') {
    // asking back: the message names its card, and a moment later the agent replies on the same card
    if (failing) return reply(400, { error: 'The agent cannot be reached right now' })
    pv.lastMessage = body
    messages.push({ id: `m${++serial}`, agent: body.agent, from: 'user', text: body.text, card_id: body.card_id, ts: Date.now() })
    push()
    setTimeout(() => {
      messages.push({ id: `m${++serial}`, agent: body.agent, from: 'agent', text: 'Good question. **Yes**, the backup covers that table too; I checked it with `pg_restore --list`.', card_id: body.card_id, ts: Date.now() })
      push()
    }, has('fast') ? 50 : 1600)
    return reply(200, { ok: true })
  }
  if (path === '/decide') {
    if (failing) return reply(400, { error: 'The agent cannot be reached right now' })
    if (!c || c.status !== 'open') return reply(400, { error: 'This question is no longer open' })
    const keys = body.keys ?? [body.key]
    if (!keys.length || !keys.every(k => c.options.some(o => o.key === k))) return reply(400, { error: 'Unknown option' })
    Object.assign(c, { status: 'decided', choice: keys[0], choices: keys, note: body.note ?? '', decided: Date.now() })
    pv.lastDecision = { card_id: c.id, ...(body.keys ? { keys } : { key: body.key }), note: body.note ?? '' }
  } else {
    if (!c || c.status === 'open') return reply(400, { error: 'This question is already open' })
    Object.assign(c, { status: 'open', choice: null, note: '', decided: null })
  }
  push()
  return reply(200, { ok: true })
}

// ── overlay ─────────────────────────────────────────────────────────────────
if (has('sayon') || has('saying') || has('sayload')) { try { localStorage.setItem('trommi-focus-read', '1') } catch {} }
const focus = mountFocus({ onDecided: (c, o) => { eventsNode.textContent += `onDecided  ${c.id} -> ${o.key}\n` } })
const eventsNode = document.getElementById('pv-events')
for (const name of ['focus:open', 'focus:close']) {
  document.addEventListener(name, () => { eventsNode.textContent += `${new Date().toLocaleTimeString('en-GB')}  ${name}\n` })
}

const currentId = () => document.querySelector('.focus-card[data-shown]')?.dataset.id
const actions = {
  open: () => focus.open(),
  more: () => focus.open(queueOf(cards)[2]),
  critical() {
    const id = `c-new-${++serial}`
    cards.push(card(id, {
      number: nextNumber++, title: 'The API key expires in 10 minutes, renew it now?', created: Date.now(), urgency: 'critical', agent: 'deploy',
      urgency_reason: 'After that every deploy fails',
      body: 'The key for the package registry expires. I can renew it myself but need your okay.',
      options: [{ key: 'ja', label: 'Renew', detail: 'New key, the old one stops working' }, { key: 'nein', label: 'Not now', detail: '' }],
    }))
    push()
  },
  raise() {
    const c = cards.find(c => c.status === 'open' && c.urgency === 'low') ?? cards.find(c => c.status === 'open' && c.urgency === 'normal')
    if (c) Object.assign(c, { urgency: 'critical', urgency_reason: 'Now blocks the plan for the week' })
    push()
  },
  remote() {
    const c = find(currentId()) ?? find(queueOf(cards)[0])
    if (c) Object.assign(c, { status: 'decided', choice: c.options[0].key, decided: Date.now() })
    push()
  },
  fail(btn) {
    failing = !failing
    btn?.setAttribute('aria-pressed', String(failing))
  },
  noise: () => push(),
  edit() {
    const c = find(currentId())
    if (c) c.body += '\n\nPS: I just added one more detail.'
    push()
  },
  many() { addMany(cards); cards.forEach(c => { c.number ??= nextNumber++ }); push() },
  clear() { for (const c of cards) if (c.status === 'open') Object.assign(c, { status: 'decided', choice: c.options[0].key, decided: Date.now() }); push() },
  reset() { cards = freshCards(); messages = []; nextNumber = cards.length + 1; push() },
  theme() {
    const root = document.documentElement
    if (root.dataset.theme === 'dark') delete root.dataset.theme
    else root.dataset.theme = 'dark'
  },
}
document.querySelector('.pv-strip').addEventListener('click', e => {
  const btn = e.target.closest('button[data-do]')
  if (btn) actions[btn.dataset.do]?.(btn)
})

// for scripted checks: pv.do('critical'), pv.focus.open('c-theme'), pv.tap(0), pv.state()
window.pv = {
  focus, do: name => actions[name]?.(), currentId, getState, lastDecision: null, lastMessage: null,
  key: (key, more = {}) => document.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true, ...more })),
  order: () => getState().later,
  tap: i => document.querySelectorAll('.focus-card[data-shown] .focus-opt')[i]?.click(),
  setFailing: v => { failing = !!v },
}

if (has('done')) for (const c of cards) if (c.status === 'open') c.status = 'decided'
if (has('thread')) {
  const id = flagValue('card') ?? 'c-migrate'
  messages.push(
    { id: 'm-a', agent: find(id).agent, from: 'user', text: 'Does the backup from 06:00 include the cards table?', card_id: id, ts: now - 3 * min },
    { id: 'm-b', agent: find(id).agent, from: 'agent', text: 'Yes. The dump is a full one, **cards** included; restoring only that table takes about ten seconds.', card_id: id, ts: now - 2 * min },
  )
}
try { localStorage.removeItem('trommi-later') } catch {}
push()
makeClip().then(url => {
  if (!url) return
  clipUrl = url
  const a = find('c-video')?.attachments.find(a => a.kind === 'video')
  if (a) { a.url = url; push() }
})

if (!has('closed')) {
  const want = flagValue('card')
  // The walk starts at the most urgent question; asked for a card, it goes there and stays the walk.
  const walkTo = id => { focus.open(); if (id) focus.open(id) }
  if (has('walk') || !want) walkTo(want)
  else focus.open(want)
  if (has('fail')) { await sleep(200); pv.tap(0) }
  if (has('undo')) {
    if (!want) walkTo('c-phone')
    await sleep(200)
    pv.tap(1)
  }
  if (has('hint')) {
    if (!want) walkTo('c-theme')
    await sleep(200)
    actions.critical()
  }
  if (has('gone')) { await sleep(200); actions.remote() }
  if (has('zoom')) {
    if (!want) walkTo('c-phone')
    await sleep(200)
    document.querySelector('.focus-card[data-shown] .focus-figure')?.click()
  }
  if (has('picked')) { await sleep(200); pv.key('1'); pv.key('3') }
  if (has('ask') || has('askfail')) {
    await sleep(200)
    if (has('askfail')) failing = true
    document.querySelector('.focus-card[data-shown] .focus-ask-open')?.click()
    const field = document.querySelector('.focus-card[data-shown] .focus-ask-field')
    field.value = 'Is the rollback tested on a copy of production?'
    field.dispatchEvent(new Event('input', { bubbles: true }))
    field.form.requestSubmit()
  }
  // what the switch looks like while audio loads or plays (there is no speech server here)
  if (has('saying') || has('sayload')) document.querySelector('.focus-say')?.setAttribute('data-speaking', has('saying') ? 'playing' : 'loading')
}
</script>
</body>
</html>
