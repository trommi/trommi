<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layout, large · Trommi</title>
<script>
(function () { try { if (localStorage.getItem('agent-board-theme') === 'dark') document.documentElement.dataset.theme = 'dark' } catch (e) {} })()
</script>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/richhtml.css">
<script type="module">
// A layout an agent sent, large: opened in a new tab by "Open large" (js/richhtml.js), which hands the block over
// under the key in the address. Shown in the same sandboxed frame as in the conversation.
import { largeBlock } from '/js/richhtml.js'
const stage = document.getElementById('stage')
const frame = largeBlock(location.hash.slice(1))
if (frame) stage.append(frame)
else { const p = document.createElement('p'); p.textContent = 'This layout is no longer here. Open it again from the conversation or the card it stands in.'; stage.append(p) }
</script>
</head>
<body class="rh-page">
<header class="rh-large-bar"><span class="rh-large-name">From the agent</span><a href="/">Back to the Desk</a></header>
<main class="rh-large-stage" id="stage"></main>
</body>
</html>
