<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Fokus-Modus · Vorschau</title>
<script>
  if (location.hash.slice(1).split(',').indexOf('dark') >= 0) document.documentElement.dataset.theme = 'dark'
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/focus.css">
<style>
  /* Workbench chrome only: a stand-in page behind the overlay. The overlay itself is styled by focus.css. */
  html, body { margin: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--fg); font: 400 var(--t-sm)/1.45 var(--font); }
  .pv-page { max-width: 880px; margin: 0 auto; padding: 20px 16px 120px; display: grid; gap: 14px; }
  .pv-page h1 { margin: 0; font: 650 var(--t-xl)/1.2 var(--display); }
  .pv-strip { display: flex; flex-wrap: wrap; gap: 6px; }
  .pv-strip button { min-height: 36px; font: 500 var(--t-xs)/1 var(--font); padding: 8px 12px; border-radius: var(--r-pill); border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); cursor: pointer; }
  .pv-strip button:hover { border-color: var(--accent); color: var(--accent); }
  .pv-strip button[aria-pressed="true"], .pv-strip button.pv-main { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .pv-fill { display: grid; gap: 10px; }
  .pv-fill p { margin: 0; padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); box-shadow: 0 0 0 1px var(--line); color: var(--muted); }
  #pv-events { font: 400 var(--t-xs)/1.5 var(--mono); color: var(--muted); white-space: pre-wrap; }
  #pv-log { position: fixed; left: 8px; bottom: 8px; z-index: 2147483600; max-width: 90vw; padding: 6px 10px; border-radius: var(--r-sm); background: var(--urg-critical); color: var(--surface); font: 500 var(--t-xs)/1.4 var(--mono); white-space: pre-wrap; }
  #pv-log:empty { display: none; }
</style>
</head>
<body>
<div class="pv-page">
  <h1>Fokus-Modus · Werkbank</h1>
  <div class="pv-strip" role="toolbar" aria-label="Overlay und Server simulieren">
    <button class="pv-main" data-do="open">Fokus öffnen</button>
    <button data-do="critical">Neue kritische Karte</button>
    <button data-do="raise">Dringlichkeit erhöhen</button>
    <button data-do="remote">Aktuelle remote entschieden</button>
    <button data-do="fail" aria-pressed="false">Entscheidung scheitert</button>
    <button data-do="noise">Fremdes Update</button>
    <button data-do="edit">Text ändert sich</button>
    <button data-do="many">Viele Karten</button>
    <button data-do="clear">Alles erledigt</button>
    <button data-do="reset">Zurücksetzen</button>
    <button data-do="theme">Hell / Dunkel</button>
  </div>
  <div class="pv-fill" id="pv-fill"></div>
  <div id="pv-events"></div>
</div>
<div id="pv-log"></div>

<script>
  // errors go on screen so a screenshot shows them
  const pvLog = msg => { document.getElementById('pv-log').textContent += msg + '\n' }
  window.onerror = (msg, src, line, col) => pvLog(`${msg} @ ${String(src).split('/').pop()}:${line}:${col}`)
  window.addEventListener('unhandledrejection', e => pvLog(`unhandled: ${e.reason?.message ?? e.reason}`))
</script>
<script type="module">
// Workbench for the Fokus-Modus overlay. It feeds the store directly and
// stands in for the server on /decide and /reopen. Hash flags (comma
// separated) put the page straight into a state for screenshots:
//   dark            theme
//   closed          do not open the overlay on load
//   second          start on the second card of the queue
//   card=<id>       start on that card: c-perm c-migrate c-phone c-video c-theme c-next
//   fail            decisions fail; the first option is tapped so the message shows
//   undo            the first decision card is answered so "Rückgängig" shows
//   hint            a more urgent card arrives while one is in front
//   gone            the card in front is decided elsewhere
//   zoom            the first image is enlarged
//   many            fourteen cards, for the capped progress dots
//   done            nothing is open
//   solo            a single agent, so no card names who is asking
// The same things are scriptable through window.pv (see the bottom of this file).
import { setState, getState } from '/js/store.js'
import { mountFocus } from '/js/focus.js'

const flags = decodeURIComponent(location.hash.slice(1)).split(',').map(f => f.trim()).filter(Boolean)
const has = f => flags.includes(f)
const flagValue = name => flags.find(f => f.startsWith(name + '='))?.slice(name.length + 1)

const fill = document.getElementById('pv-fill')
for (let i = 0; i < 14; i++) fill.append(Object.assign(document.createElement('p'), { textContent: `Seite hinter dem Overlay, Absatz ${i + 1}. Sie darf weder scrollen noch Eingaben bekommen, solange der Fokus-Modus offen ist.` }))

const RANK = { critical: 3, high: 2, normal: 1, low: 0 }
const min = 60000
const now = Date.now()
const img = name => ({ name, url: `/files/${name}`, image: true, kind: 'image' })

/** A two-second clip drawn on a canvas, so the workbench needs no video file. */
async function makeClip() {
  try {
    const canvas = Object.assign(document.createElement('canvas'), { width: 640, height: 360 })
    const ctx = canvas.getContext('2d')
    const stream = canvas.captureStream(24)
    const rec = new MediaRecorder(stream, { mimeType: 'video/webm' })
    const chunks = []
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data) }
    const stopped = new Promise(r => { rec.onstop = r })
    rec.start()
    const t0 = performance.now()
    const draw = () => {
      const t = (performance.now() - t0) / 1000
      ctx.fillStyle = '#10201b'; ctx.fillRect(0, 0, 640, 360)
      ctx.fillStyle = '#1b6a57'; ctx.fillRect(40, 60, 560, 44)
      ctx.fillStyle = '#dcefe8'
      for (let i = 0; i < 3; i++) ctx.fillRect(40, 130 + i * 62, 560 * Math.min(1, Math.max(0, t * 1.4 - i * 0.3)), 44)
      ctx.fillStyle = '#ffffff'; ctx.font = '600 22px sans-serif'; ctx.fillText('Einblend-Animation der Kartenliste', 56, 90)
      ctx.beginPath(); ctx.arc(80 + t * 240, 330, 10, 0, 7); ctx.fill()
    }
    draw()
    const timer = setInterval(draw, 40)
    await new Promise(r => setTimeout(r, 900))
    clearInterval(timer)
    rec.stop()
    await Promise.race([stopped, new Promise(r => setTimeout(r, 500))])
    if (!chunks.length) return null
    return URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }))
  } catch { return null }
}
// The clip is recorded in the background and swapped in when it is ready, so the page never waits for it.
let clipUrl = null

const card = (id, o) => ({
  id, kind: 'decision', status: 'open', urgency: 'normal', urgency_reason: '', body: '', attachments: [],
  agent: 'frontend', choice: null, note: '', summary: '', decided: null, ...o,
})

function freshCards() {
  const cards = [
    card('c-next', {
      title: 'Was baue ich als Nächstes?', created: now - 30 * min, urgency: 'low', agent: 'planung',
      body: 'Die mobile Ansicht ist fertig. Als Nächstes stehen drei größere Themen an; ich kann nur eines davon sauber in dieser Woche abschließen.',
      options: [
        { key: 'mehrere-agenten', label: 'Mehrere Agenten', detail: 'Ein Board für mehrere Sessions' },
        { key: 'verschluesselung', label: 'Verschlüsselung', detail: 'Ende-zu-Ende zwischen Browser und Agent' },
        { key: 'live-verlauf', label: 'Live-Verlauf', detail: 'Zeigt, was der Agent gerade tut' },
      ],
    }),
    card('c-theme', {
      title: 'Welches Standard-Theme?', created: now - 23 * min, urgency: 'normal', agent: 'frontend',
      body: 'Beide Themes sind fertig. Ich brauche nur den Standard für neue Nutzer.\n\n- **Hell** ist bei Tageslicht besser lesbar und passt zur Startseite\n- **Dunkel** passt zu Terminal und IDE\n- gespeichert wird die Wahl in `localStorage`, sie lässt sich jederzeit ändern',
      options: [
        { key: 'hell', label: 'Hell', detail: 'Besser lesbar bei Tageslicht' },
        { key: 'dunkel', label: 'Dunkel', detail: 'Passt zu Terminal und IDE' },
        { key: 'system', label: 'Dem System folgen', detail: 'Richtet sich nach der Geräteeinstellung' },
      ],
      attachments: [img('thema-hell.png'), img('thema-dunkel.png')],
    }),
    card('c-video', {
      title: 'Soll die Kartenliste beim Laden einblenden?', created: now - 18 * min, urgency: 'normal', agent: 'frontend',
      body: 'Im Clip siehst du die gestaffelte Einblendung, wie sie jetzt gebaut ist. Sie kostet etwa **240 ms** bis zur letzten Zeile.',
      options: [
        { key: 'ja', label: 'So lassen', detail: 'Gestaffelt, 240 ms' },
        { key: 'kurz', label: 'Kürzer', detail: 'Alle Zeilen zugleich, 120 ms' },
        { key: 'nein', label: 'Ohne Animation', detail: '' },
      ],
      attachments: [
        { name: 'kartenliste-einblenden.webm', url: clipUrl ?? '/files/kartenliste-einblenden.webm', image: false, kind: 'video' },
        { name: 'messwerte.csv', url: '/files/messwerte.csv', image: false, kind: 'file' },
      ],
    }),
    card('c-phone', {
      title: 'Wie soll das Board auf dem Handy starten?', created: now - 15 * min, urgency: 'high', agent: 'frontend',
      urgency_reason: 'Ich baue gerade an der mobilen Ansicht',
      body: 'Auf dem Handy passt nur eine Ansicht auf den Bildschirm. Links das Gespräch, rechts die Entscheidungen; in den Bildern siehst du beide Varianten.',
      options: [
        { key: 'gespraech', label: 'Mit dem Gespräch', detail: 'Wie eine Chat-App' },
        { key: 'entscheidungen', label: 'Mit den Entscheidungen', detail: 'Offene Fragen zuerst' },
        { key: 'zuletzt', label: 'Wo ich zuletzt war', detail: 'Merkt sich die letzte Ansicht' },
      ],
      attachments: [img('phone-gespraech.png'), img('phone-entscheidungen.png')],
    }),
    card('c-migrate', {
      title: 'Migration auf der Produktions-Datenbank ausführen?', created: now - 4 * min, urgency: 'critical', agent: 'deploy',
      urgency_reason: 'Deploy wartet, alle weiteren Schritte hängen davon ab',
      body: 'Die Migration `2026_10_02_add_urgency` fügt eine Spalte hinzu und füllt **48.210 Zeilen** nach. Geschätzte Dauer: 40 Sekunden, währenddessen ist die Tabelle gesperrt.\n\n```\nALTER TABLE cards ADD COLUMN urgency text NOT NULL DEFAULT \'normal\';\n```\n\n- Ein Backup von heute 06:00 liegt vor\n- Der Rollback ist getestet und dauert unter einer Sekunde',
      options: [
        { key: 'run-now', label: 'Jetzt ausführen', detail: 'Kurze Sperre, Deploy läuft danach durch' },
        { key: 'tonight', label: 'Heute Nacht um 02:00', detail: 'Kein Nutzer betroffen, Deploy wartet bis morgen' },
        { key: 'batch', label: 'In Schritten ohne Sperre', detail: 'Etwa zwei Stunden Umbau am Skript' },
        { key: 'cancel', label: 'Nicht ausführen', detail: 'Ich nehme die Änderung zurück' },
      ],
    }),
    { id: 'c-perm', kind: 'permission', status: 'open', urgency: 'critical', urgency_reason: '', request_id: 'abcde', agent: 'deploy',
      title: 'Freigabe: Bash', body: 'Run the test suite\n\n{"command":"npm test -- --coverage","timeout":120000}',
      options: [{ key: 'allow', label: 'Erlauben', detail: '' }, { key: 'deny', label: 'Ablehnen', detail: '' }],
      attachments: [], choice: null, note: '', summary: '', created: now - 1 * min, decided: null },
    card('c-db', {
      title: 'Welche Datenbank?', status: 'decided', created: now - 95 * min, decided: now - 80 * min, choice: 'pg',
      options: [{ key: 'sqlite', label: 'SQLite', detail: '' }, { key: 'pg', label: 'Postgres', detail: '' }],
    }),
  ]
  if (has('many')) addMany(cards)
  ;[...cards].sort((a, b) => a.created - b.created).forEach((c, i) => { c.number = i + 1 })
  return cards
}

function addMany(cards) {
  for (let i = 0; i < 8; i++) cards.push(card(`c-more-${i}`, {
    title: `Zusatzfrage ${i + 1}: Welche Variante?`, created: now - (40 + i) * min, urgency: ['low', 'normal', 'high'][i % 3], agent: 'planung',
    body: 'Nur damit der Stapel lang genug für die begrenzten Fortschrittspunkte ist.',
    options: [{ key: 'a', label: 'Variante A', detail: '' }, { key: 'b', label: 'Variante B', detail: '' }],
  }))
}

// ── the pretend server ──────────────────────────────────────────────────────
let cards = freshCards()
let failing = has('fail')
let serial = 0
let nextNumber = cards.length + 1

// permission cards first, then urgency, then oldest first: the server's rule
const queueOf = list => list.filter(c => c.status === 'open')
  .sort((a, b) => (b.kind === 'permission') - (a.kind === 'permission') || RANK[b.urgency] - RANK[a.urgency] || a.created - b.created)
  .map(c => c.id)
// The store derives each card's agent_name from this list; with a single agent it stays empty.
const agents = has('solo')
  ? [{ id: 'frontend', name: 'Agent', online: true }]
  : [{ id: 'frontend', name: 'Frontend', online: true }, { id: 'deploy', name: 'Deploy', online: true }, { id: 'planung', name: 'Planung', online: false }]
const push = () => setState({ agents, messages: [], cards: structuredClone(has('solo') ? cards.map(c => ({ ...c, agent: 'frontend' })) : cards), queue: queueOf(cards), tasks: [] })
const find = id => cards.find(c => c.id === id)
const reply = (status, body) => new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } })
const sleep = ms => new Promise(r => setTimeout(r, ms))

const realFetch = window.fetch.bind(window)
window.fetch = async (url, init) => {
  const path = new URL(String(url), location.href).pathname
  if (path !== '/decide' && path !== '/reopen') return realFetch(url, init)
  const body = JSON.parse(init?.body ?? '{}')
  await sleep(450)
  const c = find(body.card_id)
  if (path === '/decide') {
    if (failing) return reply(400, { error: 'Der Agent ist gerade nicht erreichbar' })
    if (!c || c.status !== 'open') return reply(400, { error: 'Karte ist nicht mehr offen' })
    if (!c.options.some(o => o.key === body.key)) return reply(400, { error: 'Unbekannte Option' })
    Object.assign(c, { status: 'decided', choice: body.key, note: body.note ?? '', decided: Date.now() })
    pv.lastDecision = { card_id: c.id, key: body.key, note: body.note ?? '' }
  } else {
    if (!c || c.status === 'open') return reply(400, { error: 'Karte ist bereits offen' })
    Object.assign(c, { status: 'open', choice: null, note: '', decided: null })
  }
  push()
  return reply(200, { ok: true })
}

// ── overlay ─────────────────────────────────────────────────────────────────
const focus = mountFocus()
const eventsNode = document.getElementById('pv-events')
for (const name of ['focus:open', 'focus:close']) {
  document.addEventListener(name, () => { eventsNode.textContent += `${new Date().toLocaleTimeString('de-DE')}  ${name}\n` })
}

const currentId = () => document.querySelector('.focus-card[data-shown]')?.dataset.id
const actions = {
  open: () => focus.open(),
  critical() {
    const id = `c-new-${++serial}`
    cards.push(card(id, {
      number: nextNumber++, title: 'API-Schlüssel läuft in 10 Minuten ab, jetzt erneuern?', created: Date.now(), urgency: 'critical', agent: 'deploy',
      urgency_reason: 'Danach schlagen alle Deploys fehl',
      body: 'Der Schlüssel für die Paketquelle läuft ab. Ich kann ihn selbst erneuern, brauche dafür aber dein Okay.',
      options: [{ key: 'ja', label: 'Erneuern', detail: 'Neuer Schlüssel, alter wird ungültig' }, { key: 'nein', label: 'Nicht jetzt', detail: '' }],
    }))
    push()
  },
  raise() {
    const c = cards.find(c => c.status === 'open' && c.urgency === 'low') ?? cards.find(c => c.status === 'open' && c.urgency === 'normal')
    if (c) Object.assign(c, { urgency: 'critical', urgency_reason: 'Blockiert jetzt den Wochenplan' })
    push()
  },
  remote() {
    const c = find(currentId()) ?? find(queueOf(cards)[0])
    if (c) Object.assign(c, { status: 'decided', choice: c.options[0].key, decided: Date.now() })
    push()
  },
  fail(btn) {
    failing = !failing
    btn?.setAttribute('aria-pressed', String(failing))
  },
  noise: () => push(),
  edit() {
    const c = find(currentId())
    if (c) c.body += '\n\nNachtrag: Ich habe gerade noch eine Kleinigkeit ergänzt.'
    push()
  },
  many() { addMany(cards); cards.forEach(c => { c.number ??= nextNumber++ }); push() },
  clear() { for (const c of cards) if (c.status === 'open') Object.assign(c, { status: 'decided', choice: c.options[0].key, decided: Date.now() }); push() },
  reset() { cards = freshCards(); nextNumber = cards.length + 1; push() },
  theme() {
    const root = document.documentElement
    if (root.dataset.theme === 'dark') delete root.dataset.theme
    else root.dataset.theme = 'dark'
  },
}
document.querySelector('.pv-strip').addEventListener('click', e => {
  const btn = e.target.closest('button[data-do]')
  if (btn) actions[btn.dataset.do]?.(btn)
})

// for scripted checks: pv.do('critical'), pv.focus.open('c-theme'), pv.tap(0), pv.state()
window.pv = {
  focus, do: name => actions[name]?.(), currentId, getState, lastDecision: null,
  tap: i => document.querySelectorAll('.focus-card[data-shown] .focus-opt')[i]?.click(),
  setFailing: v => { failing = !!v },
}

if (has('done')) for (const c of cards) if (c.status === 'open') c.status = 'decided'
push()
makeClip().then(url => {
  if (!url) return
  clipUrl = url
  const a = find('c-video')?.attachments.find(a => a.kind === 'video')
  if (a) { a.url = url; push() }
})

if (!has('closed')) {
  const queue = queueOf(cards)
  focus.open(flagValue('card') ?? (has('second') ? queue[1] : undefined))
  if (has('fail')) { await sleep(200); pv.tap(0) }
  if (has('undo')) {
    if (!flagValue('card')) focus.open('c-phone')
    await sleep(200)
    pv.tap(1)
  }
  if (has('hint')) {
    if (!flagValue('card')) focus.open('c-theme')
    await sleep(200)
    actions.critical()
  }
  if (has('gone')) { await sleep(200); actions.remote() }
  if (has('zoom')) {
    if (!flagValue('card')) focus.open('c-phone')
    await sleep(200)
    document.querySelector('.focus-card[data-shown] .focus-figure')?.click()
  }
}
</script>
</body>
</html>
