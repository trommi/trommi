# Override for agent sessions on the same machine as the container:
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.host.yaml up -d --build
#
# - Host networking, so a session's link from 127.0.0.1 arrives as 127.0.0.1.
#   The hub binds the host's loopback; nothing is published.
# - The checkout's data directory instead of the named volume, because sessions
#   read the token from <checkout>/data/token.
# - The container runs under your uid, so it can write that directory.
#   Export both first: export UID GID=$(id -g)
#
# Needs rootful Docker, or rootless Podman (there add `userns_mode: keep-id`).
# With rootless Docker "host" is the network namespace of rootlesskit, not the
# machine's, and uid 1000 in the container is not your user: this override does
# not work there. Not tested; the plain compose.yaml was.
#
# Still missing compared with the systemd service: attachments. An agent names
# a file by absolute path and the hub copies it, and the hub in the container
# does not see the host's files. Mount what agents attach from, read-only and
# under the same path, e.g. /tmp and your git directory (see below).
services:
  hub:
    network_mode: host
    ports: !reset []
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      BOARD_HOST: 127.0.0.1
      BOARD_PORT: ${BOARD_PORT:-8790}
    volumes: !override
      - ../data:/data
      # - /tmp:/tmp:ro
      # - ${HOME}/git:${HOME}/git:ro
