# Trommi hub in a container. From the repository root:
#
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml logs -f
#   docker compose -f deploy/compose.yaml exec hub cat /data/url.txt     # login links
#
# As written, this serves the board to browsers on this machine (and to the
# tailnet through `tailscale serve`), with the state in a named volume. Agent
# sessions cannot link to it: the hub accepts agents from loopback only, and a
# published port arrives from the bridge address. For sessions on the same
# machine add deploy/compose.host.yaml (host networking, data as a bind mount):
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.host.yaml up -d --build
#
# Sessions on other machines need server changes; see docs/operations.md.
# Health: the image checks GET /healthz (200 without a login); `docker compose ps` shows it.
# Project and image keep the id "trommi"; only the product name changed to Trommi.
name: trommi

services:
  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: trommi-hub:local
    init: true
    restart: unless-stopped
    environment:
      # The address a phone opens, e.g. the HTTPS name from `tailscale serve`.
      BOARD_PUBLIC_URL: ${BOARD_PUBLIC_URL:-}
      TINFOIL_API_KEY: ${TINFOIL_API_KEY:-}
    ports:
      # Loopback of the host only. Never publish this port to a network without TLS in front.
      - "127.0.0.1:${BOARD_PORT:-8790}:8790"
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  data:
