[package]
name = "trommi-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Trommi's protocol core: MLS groups through OpenMLS, and Trommi's own constructs on the same primitives."

[features]
# The seeded random source, for the generator of the specification's vectors only. Never in a shipped build.
vectors = ["dep:rand_chacha", "dep:rand_core"]

[dependencies]
openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_traits = { workspace = true }
openmls_memory_storage = { workspace = true }
# Everything below is the crate and version the OpenMLS provider itself brings: named here only to be used directly.
# The TLS presentation language, with MLS's rule that a length prefix is minimal.
tls_codec = { version = "=0.5.0", features = ["derive", "mls"] }
zeroize = "=1.9.1"
subtle = "=2.6.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
getrandom = "=0.2.17"
# The public half of a signature key from its seed; signing and verifying go through the provider.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize"] }
# HPKE's key schedule and the provider's X25519, for sealing with randomness from the caller.
hpke-rs = { version = "=0.7.0", default-features = false }
hpke-rs-crypto = "=0.7.0"
hpke-rs-rust-crypto = "=0.7.0"
# ChaCha20-Poly1305 opened in place, so that no second copy of a plaintext is made; the provider seals and opens
# with this crate.
chacha20poly1305 = { version = "=0.10.1", default-features = false }
# SHA-256 over a file as it streams by; the provider hashes with this crate.
sha2 = { version = "=0.11.0", default-features = false }
# The account's password key derivation (v1 section 16): Argon2id, in Rust alone.
argon2 = { version = "=0.5.3", default-features = false, features = ["zeroize"] }
# The account's password as NFC, as v1 section 16 derives from it.
unicode-normalization = { version = "=0.1.25", default-features = false }
rand_chacha = { version = "=0.3.1", default-features = false, optional = true }
rand_core = { version = "=0.6.4", default-features = false, optional = true }

# In a browser: randomness from crypto.getRandomValues (both getrandom generations in the tree need their switch),
# time from Date.now (web-time, through OpenMLS's "js" feature).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
openmls = { workspace = true, features = ["js"] }
getrandom = { version = "=0.2.17", features = ["js"] }
