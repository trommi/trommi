[package]
name = "trommi-core-wasm"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "trommi-core for the browser: a plain ES module and a .wasm file (wasm-bindgen --target web)."

[lib]
crate-type = ["cdylib"]

[dependencies]
trommi-core = { path = ".." }
# The exact version: the wasm-bindgen command that writes the JavaScript must be the same one.
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
