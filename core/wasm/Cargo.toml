[package]
name = "trommi-core-wasm"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "trommi-core for the browser: the shared facade (core/swift/src) as a plain ES module and a .wasm file (wasm-bindgen --target web), under a hand-written JavaScript layer with its TypeScript declarations (js/)."

[lib]
crate-type = ["cdylib"]

[features]
# Development only: see core/swift/Cargo.toml.
stand-in-recovery = ["trommi-core-swift/stand-in-recovery"]

# Only for the browser's target: a build of the whole workspace for another machine (cargo test) leaves this
# crate empty, and so does not switch the shared facade to its browser form for everyone else.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The facade, in its browser form: no UniFFI, records as plain JavaScript objects.
trommi-core-swift = { path = "../swift", default-features = false, features = ["js"] }
# The exact version: the wasm-bindgen command that writes the JavaScript must be the same one.
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
