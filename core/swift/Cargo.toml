[package]
name = "trommi-core-swift"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "The facade over trommi-core that both bindings share, and its Swift form: a static library and, through UniFFI, its Swift file and C header. core/wasm wraps the same facade for the browser."

[lib]
name = "trommi_core_ffi"
# lib: what core/wasm builds on. staticlib: what the app links. cdylib: what the binding generator reads the
# interface from (a host build).
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = ["uniffi"]
# The Swift form: UniFFI's attributes on the facade, and the store as a protocol Swift implements.
uniffi = ["dep:uniffi"]
# The browser form: the facade's records as plain JavaScript objects, and the store as a queue the page writes out.
js = ["dep:js-sys", "dep:wasm-bindgen"]
# Development only: a stand-in for the recovery construct, so that rooms can be founded before the core's device
# carries the real one (src/recovery.rs). A room founded with it cannot be recovered; never in a release.
stand-in-recovery = []

[dependencies]
trommi-core = { path = ".." }
zeroize = "=1.9.1"
uniffi = { version = "=0.32.2", optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }
js-sys = { version = "=0.3.106", optional = true }
