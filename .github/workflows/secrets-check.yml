# Proves the chain from this repository to 1Password, and nothing else: it reads one test value from the
# 1Password Environment and says whether it arrived. It deploys nothing and prints no value.
name: Secrets check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/secrets-check.yml]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Install the 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: latest-beta
      - name: Read CI_TEST from the 1Password Environment
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
        run: |
          test -n "$OP_SERVICE_ACCOUNT_TOKEN" || { echo "OP_SERVICE_ACCOUNT_TOKEN is not set for this run"; exit 1; }
          test -n "$OP_ENVIRONMENT_ID" || { echo "OP_ENVIRONMENT_ID is not set for this run"; exit 1; }
          op run --environment "$OP_ENVIRONMENT_ID" -- sh -c '
            if [ "$CI_TEST" = "hello" ]; then echo "CI_TEST arrived from 1Password";
            elif [ -n "$CI_TEST" ]; then echo "CI_TEST arrived, but with another value than expected"; exit 1;
            else echo "CI_TEST did not arrive"; exit 1; fi'
