# Proves the chain from this repository to 1Password, and nothing else: it reads the 1Password Environment and says
# which of the expected values are there and whether the two keys are readable as keys. It deploys nothing and
# prints no value.
name: Secrets check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/secrets_check.yml]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Install the 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: latest-beta
      - name: Read the 1Password Environment
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ secrets.OP_ENVIRONMENT_ID }}
        run: |
          test -n "$OP_SERVICE_ACCOUNT_TOKEN" || { echo "OP_SERVICE_ACCOUNT_TOKEN is not set for this run"; exit 1; }
          test -n "$OP_ENVIRONMENT_ID" || { echo "OP_ENVIRONMENT_ID is not set for this run"; exit 1; }
          cat > "$RUNNER_TEMP/check.sh" <<'CHECK'
          set -u
          bad=0
          # which values are there (never their content)
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APPLE_ASC_KEY APPLE_ASC_KEY_ID APPLE_ASC_ISSUER_ID APPLE_TEAM_ID SIGN_RELEASE_KEY; do
            eval "value=\${$name:-}"
            if [ -n "$value" ]; then echo "$name: there"; else echo "$name: EMPTY"; fi
          done
          # are the two keys whole: a key may arrive with its line breaks turned into spaces (the 1Password form does
          # that when a value is edited by hand), so it is put back into PEM form from its base64 body before it is read
          pem() {
            body=$(printf '%s' "$1" | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \n\r\t')
            printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' "$(printf '%s' "$body" | fold -w 64)"
          }
          for name in APPLE_ASC_KEY SIGN_RELEASE_KEY; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || continue
            lines=$(printf '%s\n' "$value" | wc -l)
            if pem "$value" | openssl pkey -noout 2>/dev/null; then
              echo "$name: a readable private key (stored in $lines lines)"
            else
              echo "$name: NOT readable as a private key (stored in $lines lines)"; bad=1
            fi
          done
          # the public half of the release signing key: not a secret, it goes into the repository
          if [ -n "${SIGN_RELEASE_KEY:-}" ]; then
            echo "SIGN_RELEASE_KEY, public half:"
            pem "$SIGN_RELEASE_KEY" | openssl pkey -pubout 2>/dev/null || true
          fi
          exit $bad
          CHECK
          op run --environment "$OP_ENVIRONMENT_ID" -- sh "$RUNNER_TEMP/check.sh"
