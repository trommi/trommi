# Runs on every commit on main: builds each part and hands what was built to that part's deploy workflow.
# Only the web part exists so far; the other parts get a job of the same shape.
name: build

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The placeholder has no build step: its files are the release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-release
          path: app/hello/public
          if-no-files-found: error

  deploy_web:
    needs: web
    uses: ./.github/workflows/deploy_web.yml
    with:
      artifact: web-release
    secrets: inherit
