# Records the web app deployment: Cloudflare builds app/web on every push to main (watch paths app/web/*, shared/*,
# connector/*); its build step (app/web/dev/build.mjs) generates public/gen/, sw.js and the preloads. This job waits
# until https://app.trommi.com serves this commit (gen/build.txt), so the "web-app" environment shows which is live.
name: Web app deploy

on:
  push:
    branches: [main]
    paths: ['app/web/**', 'shared/**', 'connector/channel-tools.mjs', 'connector/richhtml.mjs', '.github/workflows/web-app.yml']
  workflow_dispatch:

concurrency:
  group: web-app
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: web-app
      url: https://app.trommi.com
    steps:
      - name: Wait until app.trommi.com serves this commit
        run: |
          # Cloudflare's build (app/web/dev/build.mjs) writes gen/build.txt with the commit and fills sw.js; a sw.js
          # with VERSION "dev" means the build step did not run there.
          want=$(echo "${{ github.sha }}" | cut -c1-7)
          for i in $(seq 1 60); do
            got=$(curl -fsS --max-time 10 "https://app.trommi.com/gen/build.txt?ci=$i" | sed -n 's/^commit: //p' || true)
            sw=$(curl -fsS --max-time 10 "https://app.trommi.com/sw.js?ci=$i" | sed -n 's/^const VERSION = "\([^"]*\)".*/\1/p' || true)
            echo "attempt $i: build.txt commit ${got:-none}, sw.js version ${sw:-none}"
            if [ "$got" = "$want" ]; then
              [ -n "$sw" ] && [ "$sw" != "dev" ] && exit 0
              echo "::error::app.trommi.com serves this commit with an unbuilt sw.js (VERSION dev)"; exit 1
            fi
            sleep 10
          done
          echo "app.trommi.com did not serve this commit within 10 minutes (check the Cloudflare build of trommi-app)"
          exit 1
