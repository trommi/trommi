# Records the web app deployment: Cloudflare builds app/web on every push to main (watch paths app/web/*, shared/*,
# connector/*, package.json, package-lock.json); its build step (app/web/dev/build.mjs) generates public/gen/ (with the
# connector bundle, its checksum and the plugin, after npm ci at the repository root), sw.js and the preloads. This job
# waits until https://app.trommi.com serves a build of the newest commit that touched those paths, so the "web-app"
# environment shows which is live, and checks that the connector it serves matches the checksum it serves.
# Which commit that build names (gen/build.txt) depends on the push: Cloudflare builds the head of a push that changed
# something in the watch paths, and never a push that changed nothing there (like one to this file alone). So the
# served commit is the newest commit in the watch paths, or a later one up to this run's commit when the push carried
# more on top of it (a README commit after the code): from there on the watch paths are the same.
# The trigger paths are Cloudflare's watch paths plus this file; the step below names the same list.
name: Web app deploy

on:
  push:
    branches: [main]
    paths: ['app/web/**', 'shared/**', 'connector/**', 'package.json', 'package-lock.json', '.github/workflows/web-app.yml']
  workflow_dispatch:

concurrency:
  group: web-app
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: web-app
      url: https://app.trommi.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until app.trommi.com serves a build of the newest commit in Cloudflare's watch paths
        run: |
          # Cloudflare's build (app/web/dev/build.mjs) writes gen/build.txt with the commit it built (7 characters: the
          # head of the push) and fills sw.js; a sw.js with VERSION "dev" means the build step did not run there.
          paths='app/web shared connector package.json package-lock.json'
          full=$(git log -1 --format=%H -- $paths)
          want=$(echo "$full" | cut -c1-7)
          # Is the served commit a build of $want: $want itself, or a later commit on the way to this run's commit with
          # no change to the watch paths in between? Anything else (older, unknown here, not a commit) is not.
          current() {
            local served
            echo "$1" | grep -Eq '^[0-9a-f]{7,40}$' || return 1
            served=$(git rev-parse --verify --quiet "$1^{commit}") || return 1
            git merge-base --is-ancestor "$full" "$served" || return 1
            git merge-base --is-ancestor "$served" HEAD || return 1
            [ -z "$(git log -1 --format=%H "$full..$served" -- $paths)" ]
          }
          echo "newest commit in Cloudflare's watch paths: $want (this run: $(echo "${{ github.sha }}" | cut -c1-7))"
          for i in $(seq 1 60); do
            got=$(curl -fsS --max-time 10 "https://app.trommi.com/gen/build.txt?ci=$i" | sed -n 's/^commit: //p' || true)
            sw=$(curl -fsS --max-time 10 "https://app.trommi.com/sw.js?ci=$i" | sed -n 's/^const VERSION = "\([^"]*\)".*/\1/p' || true)
            echo "attempt $i: build.txt commit ${got:-none}, sw.js version ${sw:-none}"
            if current "$got"; then
              [ -n "$sw" ] && [ "$sw" != "dev" ] && break
              echo "::error::app.trommi.com serves $got with an unbuilt sw.js (VERSION dev)"; exit 1
            fi
            if [ "$i" = 60 ]; then
              echo "::error::app.trommi.com did not serve $want within 10 minutes; it serves ${got:-nothing} (check the Cloudflare build of trommi-app)"
              exit 1
            fi
            sleep 10
          done

      # The connect script and the plugin install what these two addresses serve: both must be there (200) and agree.
      # A rollout swaps the files one after another: for a moment connector.mjs is the new one while its checksum or the
      # marketplace is still the old one. So the whole check is tried again, 12 times 10 s apart, before it fails.
      - name: The connector is served and matches its checksum
        run: |
          check() {
            local q="ci=${{ github.run_id }}-$1" want got zip
            curl -fsS --max-time 30 -o connector.mjs "https://app.trommi.com/connector.mjs?$q" || { why="app.trommi.com/connector.mjs is not served"; return 1; }
            want=$(curl -fsS --max-time 10 "https://app.trommi.com/connector.mjs.sha256?$q" | cut -d ' ' -f 1 | tr -d '\r\n')
            got=$(sha256sum connector.mjs | cut -d ' ' -f 1)
            echo "connector.mjs sha256 $got, connector.mjs.sha256 says $want"
            [ -n "$want" ] && [ "$got" = "$want" ] || { why="app.trommi.com/connector.mjs does not match connector.mjs.sha256"; return 1; }
            # The plugin's archive: plugins[0].source.url of the marketplace (the owner has a url too, so no grep for "url").
            zip=$(curl -fsS --max-time 10 "https://app.trommi.com/plugins/marketplace.json?$q" | node -e 'let s = ""; process.stdin.on("data", d => { s += d }).on("end", () => console.log(JSON.parse(s).plugins[0].source.url))')
            echo "plugin archive $zip"
            case "$zip" in *"/trommi-$(echo "$got" | cut -c1-12).zip") ;; *) why="the marketplace does not name the plugin of this connector"; return 1 ;; esac
            curl -fsS --max-time 30 -o /dev/null "$zip" || { why="the plugin archive $zip is not served"; return 1; }
          }
          why=
          for try in $(seq 1 12); do
            check "$try" && exit 0
            echo "try $try of 12: $why"
            [ "$try" -lt 12 ] && sleep 10
          done
          echo "::error::$why"
          exit 1
