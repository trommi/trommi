# Records the web app deployment: Cloudflare builds app/web on every push to main (watch path app/web/*).
# This job waits until https://app.trommi.com serves the pushed sw.js and index.html, so the
# "web-app" environment on GitHub shows which commit is live.
name: Web app deploy

on:
  push:
    branches: [main]
    paths: ['app/web/**', '.github/workflows/web-app.yml']
  workflow_dispatch:

concurrency:
  group: web-app
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: web-app
      url: https://app.trommi.com
    steps:
      - uses: actions/checkout@v4

      - name: Wait until app.trommi.com serves this commit
        run: |
          want_sw=$(sha256sum app/web/public/sw.js | cut -d' ' -f1)
          want_index=$(sha256sum app/web/public/index.html | cut -d' ' -f1)
          for i in $(seq 1 60); do
            got_sw=$(curl -fsS --max-time 10 "https://app.trommi.com/sw.js?ci=$i" | sha256sum | cut -d' ' -f1 || true)
            got_index=$(curl -fsS --max-time 10 "https://app.trommi.com/index.html?ci=$i" | sha256sum | cut -d' ' -f1 || true)
            echo "attempt $i: sw $([ "$got_sw" = "$want_sw" ] && echo ok || echo old), index $([ "$got_index" = "$want_index" ] && echo ok || echo old)"
            [ "$got_sw" = "$want_sw" ] && [ "$got_index" = "$want_index" ] && exit 0
            sleep 10
          done
          echo "app.trommi.com did not serve this commit within 10 minutes (check the Cloudflare build of trommi-app)"
          exit 1
