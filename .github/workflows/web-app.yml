# Records the web app deployment: Cloudflare builds app/web on every push to main (watch path app/web/*).
# This job waits until https://app.trommi.com serves the pushed sw.js and app code (HTML is left out: Cloudflare may rewrite it), so the
# "web-app" environment on GitHub shows which commit is live.
name: Web app deploy

on:
  push:
    branches: [main]
    paths: ['app/web/**', '.github/workflows/web-app.yml']
  workflow_dispatch:

concurrency:
  group: web-app
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: web-app
      url: https://app.trommi.com
    steps:
      - uses: actions/checkout@v4

      - name: Wait until app.trommi.com serves this commit
        run: |
          # sw.js as Cloudflare's build writes it (app/web/dev/build.mjs: the stylesheet bundle into its shell list);
          # the source sw.js means the build step did not run there (the app works, without the bundle).
          src_sw=$(sha256sum app/web/public/sw.js | cut -d' ' -f1)
          node app/web/dev/build.mjs --write
          want_sw=$(sha256sum app/web/public/sw.js | cut -d' ' -f1)
          want_app=$(sha256sum app/web/public/js/app/room.mjs | cut -d' ' -f1)
          for i in $(seq 1 60); do
            got_sw=$(curl -fsS --max-time 10 "https://app.trommi.com/sw.js?ci=$i" | sha256sum | cut -d' ' -f1 || true)
            got_app=$(curl -fsS --max-time 10 "https://app.trommi.com/js/app/room.mjs?ci=$i" | sha256sum | cut -d' ' -f1 || true)
            echo "attempt $i: sw $([ "$got_sw" = "$want_sw" ] && echo ok || { [ "$got_sw" = "$src_sw" ] && echo unbuilt || echo old; }), app $([ "$got_app" = "$want_app" ] && echo ok || echo old)"
            if [ "$got_sw" = "$src_sw" ] && [ "$got_app" = "$want_app" ] && [ "$src_sw" != "$want_sw" ]; then
              echo "::warning::app.trommi.com serves this commit without the build step (no stylesheet bundle): Cloudflare did not run 'node dev/build.mjs'"
              exit 0
            fi
            [ "$got_sw" = "$want_sw" ] && [ "$got_app" = "$want_app" ] && exit 0
            sleep 10
          done
          echo "app.trommi.com did not serve this commit within 10 minutes (check the Cloudflare build of trommi-app)"
          exit 1
