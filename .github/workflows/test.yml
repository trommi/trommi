# The suites of the hub, the crypto library, the client core and the agent channel. Each starts its own hubs on
# free ports with throwaway data directories. Needs Node with node:sqlite; no browser (the browser tests stay local).
name: Test

on:
  push:
    paths: ['core/**', 'hub/**', 'connector/**', 'fuzz/**', 'app/web/**', 'package.json', 'package-lock.json', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App layout
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # app/web/README.md "Rules": the file set, who imports whom, no crypto outside the core, inline script hashes.
      - run: node app/web/dev/check.mjs
      - run: node app/web/dev/build.mjs

  hub:
    name: Hub and crypto suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: node core/crypto-test.mjs --no-bench
      - run: node core/hub-crypto-test.mjs
      - run: node hub/test.mjs
      - run: node hub/ops/test.mjs
      - run: node hub/accounts-test.mjs
      - run: node hub/admin-test.mjs
      - run: node core/session-grants-test.mjs

  core:
    name: Core and connector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node core/test.mjs
      - run: node connector/channel-test.mjs
      - run: node connector/monitor-test.mjs
      # app/web/public/gen/connector.mjs (and gen/plugins/) is generated (connector/bundle.mjs) and committed: it must match the sources.
      - run: node connector/bundle.mjs --check
      - run: node connector/connect-test.mjs
