# The suites of the hub, the crypto library, the client core and the agent connector; the lists are the scripts in
# package.json (`npm test` runs all three). Each starts its own hubs on free ports with throwaway data directories.
# Needs Node with node:sqlite; no browser (the browser tests stay local).
name: Test

# Manual only for now: the account's Actions minutes are nearly used up (2026-10-08). The hub deploy still runs
# test:hub and the quick fuzz before every hub deploy; run the full suite locally with `npm test`.
on:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App layout
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # app/web/README.md "Rules": the file set, who imports whom, no crypto outside the core, inline script hashes.
      - run: npm run test:app
      # The whole build as Cloudflare runs it, into the checkout: gen/ with the connector bundle and the plugin.
      - run: node app/web/dev/build.mjs --write
      - run: test -s app/web/public/gen/connector.mjs && (cd app/web/public/gen && echo "$(cat connector.mjs.sha256)  connector.mjs" | sha256sum -c -) && ls app/web/public/gen/plugins/marketplace.json app/web/public/gen/plugins/trommi-*.zip && grep -q 'src="/gen/app/app-' app/web/public/index.html && ls app/web/public/gen/app/app-*.mjs

  hub:
    name: Hub and crypto suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm run test:hub

  core:
    name: Core and connector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # shared/test.mjs, connector/test.mjs (fast) and connector/test-e2e.mjs (a local hub; its last part builds the
      # connector bundle and installs it with the connect script).
      - run: npm run test:core
