# The suites of the hub, the crypto library, the client core and the agent channel. Each starts its own hubs on
# free ports with throwaway data directories. Needs Node with node:sqlite; no browser (the browser tests stay local).
name: Test

on:
  push:
    paths: ['crypto/**', 'hub/**', 'client/**', 'fuzz/**', 'package.json', 'package-lock.json', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hub:
    name: Hub and crypto suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: node crypto/test.mjs --no-bench
      - run: node crypto/hub-test.mjs
      - run: node hub/test.mjs
      - run: node hub/ops/test.mjs
      - run: node hub/accounts-test.mjs
      - run: node hub/admin-test.mjs
      - run: node crypto/session-grants-test.mjs

  core:
    name: Client core and agent channel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node client/core/test.mjs
      - run: node hub/channel-test.mjs
