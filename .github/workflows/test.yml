# The suites of the hub, the crypto library, the client core and the agent channel; the lists are the scripts in
# package.json (`npm test` runs all three). Each starts its own hubs on free ports with throwaway data directories.
# Needs Node with node:sqlite; no browser (the browser tests stay local).
name: Test

on:
  push:
    paths: ['core/**', 'hub/**', 'connector/**', 'dev/**', 'app/web/**', 'package.json', 'package-lock.json', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App layout
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # app/web/README.md "Rules": the file set, who imports whom, no crypto outside the core, inline script hashes.
      - run: npm run test:app
      - run: node app/web/dev/build.mjs

  hub:
    name: Hub and crypto suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm run test:hub

  core:
    name: Core and connector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Includes connector/bundle.mjs --check: app/web/public/gen/connector.mjs (and gen/plugins/) is generated and
      # committed, it must match the sources.
      - run: npm run test:core
