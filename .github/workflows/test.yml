# The suites of the hub, the crypto library, the client core and the agent connector; the lists are the scripts in
# package.json (`npm test` runs all three). Each starts its own hubs on free ports with throwaway data directories.
# Needs Node with node:sqlite; no browser (the browser tests stay local).
name: Test

# Manual only for now: the account's Actions minutes are nearly used up (2026-10-08). The hub deploy still runs
# test:hub and the quick fuzz before every hub deploy; run the full suite locally with `npm test`.
on:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App layout
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # app/web/README.md "Rules": the file set, who imports whom, no crypto outside the core, inline script hashes.
      - run: npm run test:app
      # The whole build as Cloudflare runs it, into the checkout.
      - run: node app/web/dev/build.mjs --write
      - run: test -s app/web/public/gen/vendor/tools-reference.mjs && grep -q 'src="/gen/app/app-' app/web/public/index.html && ls app/web/public/gen/app/app-*.mjs

  hub:
    name: Hub and crypto suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - run: npm run test:hub

  core:
    name: Core and connector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # shared/test.mjs, connector/test.mjs (fast) and connector/test-e2e.mjs (a local hub; its last part installs the
      # connector with the connect script). Both build connector-rs first (cargo of the runner image).
      - run: npm run test:core
