# Builds the iOS app (ios/TrommiApp) with the official Xcode on a GitHub macOS runner when started by hand
# (workflow_dispatch), uploads it to App Store Connect and hands it to the internal TestFlight group "Intern" (the
# "ios-beta" environment links the app's TestFlight page). Steps: the bundle id with Push on and the app record (asc.py prepare) ->
# Trommi.xcodeproj from AppStore/project.yml (XcodeGen) -> archive (Release, automatic signing through the App Store
# Connect API key) -> export for App Store Connect with destination upload (internal testing only) -> wait until App Store
# Connect has processed the build (VALID) -> the group "Intern" holds it and the owner is a tester.
# Version: MARKETING_VERSION in AppStore/project.yml; build number: this workflow's run number.
# Environment "ios-beta": secret ASC_KEY (the .p8 of a team key with the Admin role: cloud-managed distribution
# signing refuses App Manager keys), variables ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID;
# optional ITS_NON_EXEMPT_ENCRYPTION (YES or NO: the export compliance answer written into every build; unset, each
# build waits for the answer in App Store Connect) and TESTFLIGHT_TESTER (default: the account holder).
# Linux development builds (xtool dev, ios/README.md) do not use any of this.
name: iOS beta (TestFlight)

# Manual only (macOS minutes count ten times): gh workflow run ios-beta.yml
on:
  workflow_dispatch:

concurrency:
  group: ios-beta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    # macOS with Xcode 27 (Swift 6.4, the toolchain the Linux builds use); the image is a GitHub preview.
    runs-on: xcode-27
    timeout-minutes: 90
    environment:
      name: ios-beta
      url: ${{ steps.prepare.outputs.app_id && format('https://appstoreconnect.apple.com/apps/{0}/testflight/ios', steps.prepare.outputs.app_id) || 'https://appstoreconnect.apple.com/apps' }}
    env:
      BUNDLE_ID: com.trommi.ios
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUILD: ${{ github.run_number }}
      XCODE_APP: /Applications/Xcode_27.app
      APPSTORE: ios/TrommiApp/AppStore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: App Store Connect key
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: |
          [ -n "$ASC_KEY" ] || { echo "::error::the ios-beta environment has no ASC_KEY secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/asc" && chmod 700 "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # The bundle id (registered with Push Notifications if missing) and the app record (the API cannot create one).
      - name: Bundle id and app record
        id: prepare
        run: python3 "$APPSTORE/asc.py" prepare "$BUNDLE_ID"

      - name: Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec "$APPSTORE/project.yml"
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' "$APPSTORE/project.yml")
          [ -n "$version" ] || { echo "::error::no MARKETING_VERSION in project.yml"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "building $BUNDLE_ID $version ($BUILD)"

      - name: Archive
        run: |
          extra=()
          case "${{ vars.ITS_NON_EXEMPT_ENCRYPTION }}" in
            YES|NO) extra+=("INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=${{ vars.ITS_NON_EXEMPT_ENCRYPTION }}") ;;
          esac
          xcodebuild archive \
            -project "$APPSTORE/Trommi.xcodeproj" -scheme Trommi -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Trommi.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" "${extra[@]}"

      # What went into the archive: the bundle id, version, build number and the production push entitlement.
      - name: Check the archive
        run: |
          app="$RUNNER_TEMP/Trommi.xcarchive/Products/Applications/Trommi.app"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Info.plist"; }
          echo "$(plist CFBundleIdentifier) $(plist CFBundleShortVersionString) ($(plist CFBundleVersion))"
          [ "$(plist CFBundleIdentifier)" = "$BUNDLE_ID" ] && [ "$(plist CFBundleVersion)" = "$BUILD" ]
          test -d "$app/TrommiApp_TrommiApp.bundle" || { echo "::error::the package's resource bundle is missing"; exit 1; }
          codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :aps-environment' "$RUNNER_TEMP/entitlements.plist"

      # Export for App Store Connect and upload in one go (destination upload), signed with the team's distribution
      # certificate (automatic signing, created or fetched through the API key); internal TestFlight testing only.
      - name: Export and upload
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Trommi.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Verify (App Store Connect processed the build)
        id: verify
        run: python3 "$APPSTORE/asc.py" wait "$VERSION" "$BUILD"

      - name: Internal group "Intern"
        run: python3 "$APPSTORE/asc.py" internal "${{ steps.verify.outputs.build_id }}" Intern "${{ vars.TESTFLIGHT_TESTER || '82179548+chriopter@users.noreply.github.com' }}"

      # TestFlight "What to Test": the subject of the commit this build comes from.
      - name: What to Test
        continue-on-error: true
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          subject=${SUBJECT%%$'\n'*}
          [ -n "$subject" ] || subject=$(git log -1 --format=%s)
          python3 "$APPSTORE/asc.py" notes "${{ steps.verify.outputs.build_id }}" "Neu in Build $BUILD (${GITHUB_SHA::7}): $subject"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
