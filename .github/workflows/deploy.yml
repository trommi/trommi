# Deploys the thin hub (hub/server.mjs, image hub/Dockerfile) to trommi-hub on every push to main:
# test -> build on GitHub -> Tailscale (tag:trommi-ci) -> docker load on the server ->
# stop, back up /srv/trommi/data, start -> https://hub.trommi.com/healthz reports this commit.
name: Deploy

on:
  push:
    branches: [main]
    # Only what goes into the image restarts the hub (a restart drops every open stream).
    paths: ['hub/**', 'crypto/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://hub.trommi.com
    permissions:
      contents: read
      id-token: write
    env:
      HOST: root@trommi-hub.tail276436.ts.net
      IMAGE: trommi-hub:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Test crypto and hub
        run: |
          node crypto/test.mjs --no-bench
          node crypto/hub-test.mjs
          node hub/test.mjs
          node hub/ops/test.mjs
          node hub/accounts-test.mjs

      - name: Build image
        run: docker build -f hub/Dockerfile --build-arg COMMIT=${{ github.sha }} -t "$IMAGE" .

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:trommi-ci
          ping: trommi-hub.tail276436.ts.net

      - name: Ship image
        run: docker save "$IMAGE" | gzip | ssh -o StrictHostKeyChecking=no "$HOST" 'gunzip | docker load'

      - name: Back up data (online SQLite copy) and restart hub
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'bash -s' < hub/deploy-backup.sh
          ssh -o StrictHostKeyChecking=no "$HOST" "set -e
            cd /srv/trommi
            docker tag $IMAGE trommi-hub:current
            docker compose up -d hub
            docker image prune -f >/dev/null"

      - name: Verify
        run: |
          for i in $(seq 1 30); do
            got=$(curl -fsS --max-time 5 https://hub.trommi.com/healthz | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)
            echo "attempt $i: $got"
            [ "$got" = "${{ github.sha }}" ] && exit 0
            sleep 3
          done
          echo "hub.trommi.com never reported ${{ github.sha }}"
          exit 1
