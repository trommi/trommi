# Deploys the thin hub (hub/server.mjs, image hub/Dockerfile) to trommi-hub on every push to main:
# test -> build on GitHub -> Tailscale (tag:trommi-ci) -> docker load on the server ->
# stop, back up /srv/trommi/data, start -> https://hub.trommi.com/healthz reports this commit; if it never does, the
# previous image (its id kept in /srv/trommi/previous-image) is started again and the job fails.
# Admin page: hub/deploy-admin.sh writes admin.env + compose.override.yaml (127.0.0.1:8791 only) from the repository
# variable ADMIN_LOGINS and the hub environment secret ADMIN_PASSWORD_HASH; reached over the tailnet at
# https://trommi-hub.tail276436.ts.net:8443 (tailscale serve on the server).
name: Hub deploy

on:
  push:
    branches: [main]
    # Only what goes into the image restarts the hub (a restart drops every open stream).
    paths: ['hub/**', 'shared/crypto/zcrypto.mjs', 'shared/crypto/hub.mjs', 'shared/crypto/session-grants.mjs', 'shared/codec.mjs', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: hub
      url: https://hub.trommi.com
    permissions:
      contents: read
      id-token: write
    env:
      HOST: root@trommi-hub.tail276436.ts.net
      IMAGE: trommi-hub:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      - name: Test crypto and hub
        run: npm run test:hub

      # Blocks the deploy on any fuzz failure not listed in dev/fuzz/known-open.json (dev/fuzz/FINDINGS.md).
      - name: Fuzz (quick)
        run: npm run fuzz

      # PREVIEW_ORIGINS: the design preview served from the developer desktop over tailscale serve (tailnet only),
      # which talks to this hub; the repository variable HUB_PREVIEW_ORIGINS (comma list) replaces the default.
      - name: Build image
        env:
          PREVIEW_ORIGINS: ${{ vars.HUB_PREVIEW_ORIGINS || 'https://desktop.TAILNET.ts.net:8443' }}
        run: docker build -f hub/Dockerfile --build-arg COMMIT=${{ github.sha }} --build-arg PREVIEW_ORIGINS="$PREVIEW_ORIGINS" -t "$IMAGE" .

      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:trommi-ci
          ping: trommi-hub.tail276436.ts.net

      # Port 22 on the tailnet name is Tailscale SSH; it presents the server's own /etc/ssh host keys, pinned in the hub
      # environment variable HUB_KNOWN_HOSTS (ssh-keyscan trommi-hub.tail276436.ts.net, checked against the server).
      - name: Pin the server's host keys
        env:
          HUB_KNOWN_HOSTS: ${{ vars.HUB_KNOWN_HOSTS }}
        run: |
          [ -n "$HUB_KNOWN_HOSTS" ] || { echo "::error::the hub environment has no HUB_KNOWN_HOSTS variable"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$HUB_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ship image
        run: docker save "$IMAGE" | gzip | ssh -o StrictHostKeyChecking=yes "$HOST" 'gunzip | docker load'

      # APNs for the iOS app: the hub environment secret APNS_KEY (the .p8, newlines as \n) and the variables
      # APNS_KEY_ID, APNS_TEAM_ID, APNS_TOPIC -> /srv/trommi/apns.env; deploy-admin.sh adds it to the hub's env_file.
      - name: APNs config (apns.env)
        env:
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
          APNS_TOPIC: ${{ vars.APNS_TOPIC }}
        run: |
          scp -o StrictHostKeyChecking=yes hub/deploy-apns.sh "$HOST:/srv/trommi/deploy-apns.sh"
          printf '%s\n%s\n%s\n%s\n' "$APNS_KEY" "$APNS_KEY_ID" "$APNS_TEAM_ID" "$APNS_TOPIC" | ssh -o StrictHostKeyChecking=yes "$HOST" 'bash /srv/trommi/deploy-apns.sh; s=$?; rm -f /srv/trommi/deploy-apns.sh; exit $s'

      - name: Admin page config (admin.env, compose.override.yaml)
        env:
          ADMIN_LOGINS: ${{ vars.ADMIN_LOGINS }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        run: |
          scp -o StrictHostKeyChecking=yes hub/deploy-admin.sh "$HOST:/srv/trommi/deploy-admin.sh"
          printf '%s\n%s\n' "$ADMIN_LOGINS" "$ADMIN_PASSWORD_HASH" | ssh -o StrictHostKeyChecking=yes "$HOST" 'bash /srv/trommi/deploy-admin.sh; s=$?; rm -f /srv/trommi/deploy-admin.sh; exit $s'

      - name: Back up data (online SQLite copy) and restart hub
        run: |
          ssh -o StrictHostKeyChecking=yes "$HOST" 'bash -s' < hub/deploy-backup.sh
          ssh -o StrictHostKeyChecking=yes "$HOST" "set -e
            cd /srv/trommi
            # The image running before this deploy, for the rollback below (empty on the very first deploy).
            docker image inspect -f '{{.Id}}' trommi-hub:current > previous-image 2>/dev/null || : > previous-image
            docker tag $IMAGE trommi-hub:current
            docker compose up -d hub
            docker image prune -f >/dev/null"

      - name: Verify
        id: verify
        run: |
          for i in $(seq 1 30); do
            got=$(curl -fsS --max-time 5 https://hub.trommi.com/healthz | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)
            echo "attempt $i: $got"
            [ "$got" = "${{ github.sha }}" ] && exit 0
            sleep 3
          done
          echo "::error::hub.trommi.com never reported ${{ github.sha }}"
          exit 1

      # Verify failed: the image that ran before goes back up, and the job stays red (the rollback never makes it green).
      - name: Roll back to the previous image
        if: failure() && steps.verify.outcome == 'failure'
        run: |
          ssh -o StrictHostKeyChecking=yes "$HOST" "set -e
            cd /srv/trommi
            prev=\$(cat previous-image 2>/dev/null || true)
            [ -n \"\$prev\" ] || { echo 'no previous image recorded: nothing to roll back to'; exit 1; }
            docker tag \"\$prev\" trommi-hub:current
            docker compose up -d hub
            echo \"rolled back to \$prev\""
          for i in $(seq 1 30); do curl -fsS --max-time 5 https://hub.trommi.com/healthz && break; sleep 3; done
          echo "::error::deploy of ${{ github.sha }} failed its check; the hub was rolled back to the previous image"
          exit 1

      # The admin listener answers on the host's loopback only: no header -> 403, an allowed login -> the login form.
      - name: Verify admin page
        if: vars.ADMIN_LOGINS != ''
        env:
          FIRST_LOGIN: ${{ vars.ADMIN_LOGINS }}
        run: |
          first="${FIRST_LOGIN%%,*}"
          ssh -o StrictHostKeyChecking=yes "$HOST" "set -e
            cd /srv/trommi
            echo \"published: \$(docker compose port hub 8791)\"
            [ \"\$(docker compose port hub 8791)\" = 127.0.0.1:8791 ]
            for i in \$(seq 1 20); do code=\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/ || true); [ \"\$code\" = 403 ] && break; sleep 2; done
            curl -s http://127.0.0.1:8791/ | grep -q 'missing Tailscale-User-Login'
            curl -s -H 'Tailscale-User-Login: $first' http://127.0.0.1:8791/ | grep -q 'Admin password'
            echo 'admin page: header check and login form ok'"
