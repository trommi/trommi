# Deploys the thin hub (hub/server.mjs, image hub/Dockerfile) to trommi-hub on every push to main:
# test -> build on GitHub -> Tailscale (tag:trommi-ci) -> docker load on the server ->
# stop, back up /srv/trommi/data, start -> https://hub.trommi.com/healthz reports this commit.
# Admin page: hub/deploy-admin.sh writes admin.env + compose.override.yaml (127.0.0.1:8791 only) from the repository
# variable ADMIN_LOGINS and the hub environment secret ADMIN_PASSWORD_HASH; reached over the tailnet at
# https://trommi-hub.tail276436.ts.net:8443 (tailscale serve on the server).
name: Hub deploy

on:
  push:
    branches: [main]
    # Only what goes into the image restarts the hub (a restart drops every open stream).
    paths: ['hub/**', 'core/zcrypto.mjs', 'core/hub.mjs', 'core/session-grants.mjs', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: hub
      url: https://hub.trommi.com
    permissions:
      contents: read
      id-token: write
    env:
      HOST: root@trommi-hub.tail276436.ts.net
      IMAGE: trommi-hub:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Test crypto and hub
        run: |
          node core/crypto-test.mjs --no-bench
          node core/hub-crypto-test.mjs
          node hub/test.mjs
          node hub/ops/test.mjs
          node hub/accounts-test.mjs
          node hub/admin-test.mjs

      # Blocks the deploy on any fuzz failure not listed in fuzz/known-open.json (fuzz/FINDINGS.md).
      - name: Fuzz (quick)
        run: node fuzz/run.mjs --quick

      # PREVIEW_ORIGINS: the design preview served from the developer desktop over tailscale serve (tailnet only),
      # which talks to this hub; the repository variable HUB_PREVIEW_ORIGINS (comma list) replaces the default.
      - name: Build image
        env:
          PREVIEW_ORIGINS: ${{ vars.HUB_PREVIEW_ORIGINS || 'https://desktop.TAILNET.ts.net:8443' }}
        run: docker build -f hub/Dockerfile --build-arg COMMIT=${{ github.sha }} --build-arg PREVIEW_ORIGINS="$PREVIEW_ORIGINS" -t "$IMAGE" .

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:trommi-ci
          ping: trommi-hub.tail276436.ts.net

      - name: Ship image
        run: docker save "$IMAGE" | gzip | ssh -o StrictHostKeyChecking=no "$HOST" 'gunzip | docker load'

      - name: Admin page config (admin.env, compose.override.yaml)
        env:
          ADMIN_LOGINS: ${{ vars.ADMIN_LOGINS }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        run: |
          scp -o StrictHostKeyChecking=no hub/deploy-admin.sh "$HOST:/srv/trommi/deploy-admin.sh"
          printf '%s\n%s\n' "$ADMIN_LOGINS" "$ADMIN_PASSWORD_HASH" | ssh -o StrictHostKeyChecking=no "$HOST" 'bash /srv/trommi/deploy-admin.sh; s=$?; rm -f /srv/trommi/deploy-admin.sh; exit $s'

      - name: Back up data (online SQLite copy) and restart hub
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'bash -s' < hub/deploy-backup.sh
          ssh -o StrictHostKeyChecking=no "$HOST" "set -e
            cd /srv/trommi
            docker tag $IMAGE trommi-hub:current
            docker compose up -d hub
            docker image prune -f >/dev/null"

      - name: Verify
        run: |
          for i in $(seq 1 30); do
            got=$(curl -fsS --max-time 5 https://hub.trommi.com/healthz | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)
            echo "attempt $i: $got"
            [ "$got" = "${{ github.sha }}" ] && exit 0
            sleep 3
          done
          echo "hub.trommi.com never reported ${{ github.sha }}"
          exit 1

      # The admin listener answers on the host's loopback only: no header -> 403, an allowed login -> the login form.
      - name: Verify admin page
        if: vars.ADMIN_LOGINS != ''
        env:
          FIRST_LOGIN: ${{ vars.ADMIN_LOGINS }}
        run: |
          first="${FIRST_LOGIN%%,*}"
          ssh -o StrictHostKeyChecking=no "$HOST" "set -e
            cd /srv/trommi
            echo \"published: \$(docker compose port hub 8791)\"
            [ \"\$(docker compose port hub 8791)\" = 127.0.0.1:8791 ]
            for i in \$(seq 1 20); do code=\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/ || true); [ \"\$code\" = 403 ] && break; sleep 2; done
            curl -s http://127.0.0.1:8791/ | grep -q 'missing Tailscale-User-Login'
            curl -s -H 'Tailscale-User-Login: $first' http://127.0.0.1:8791/ | grep -q 'Admin password'
            echo 'admin page: header check and login form ok'"
