# Actions are pinned to commit SHAs (version as comment); Dependabot bumps both. npm: three direct dependencies, one
# grouped pull request a month. No workflow runs on pull requests, so these cost no Actions minutes until merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ['*']
