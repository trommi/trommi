<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernly: launch checklist</title>
<style>
  :root { --forest: #1f4d3a; --leaf: #4c8f68; --clay: #d9683c; --paper: #f6f1e7; --linen: #efe3cf; --ink: #1d2a24; --soft: #5b6b62; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 20px 64px; background: var(--paper); color: var(--ink); font: 17px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 620px; margin: 0 auto; }
  .eyebrow { margin: 0; color: var(--leaf); font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  h1 { margin: 6px 0 4px; color: var(--forest); font-size: 38px; line-height: 1.1; letter-spacing: -.02em; }
  .lead { margin: 0 0 22px; color: var(--soft); }
  .bar { height: 12px; border-radius: 99px; background: var(--linen); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: var(--leaf); transition: width .3s; }
  .count { margin: 8px 0 26px; color: var(--soft); font-size: 15px; }
  h2 { margin: 26px 0 10px; color: var(--forest); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  label { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: #fff; border: 1.5px solid #e6dcc8; border-radius: 18px; cursor: pointer; }
  input { appearance: none; flex: none; width: 24px; height: 24px; margin: 0; border: 2px solid var(--leaf); border-radius: 8px; display: grid; place-items: center; cursor: pointer; }
  input:checked { background: var(--leaf); }
  input:checked::after { content: ""; width: 11px; height: 6px; margin-top: -3px; border: solid #fff; border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg); }
  input:checked + span { color: var(--soft); text-decoration: line-through; }
  small { margin-left: auto; padding: 3px 10px; border-radius: 99px; background: var(--clay); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; }
</style>
<main>
  <p class="eyebrow">Fernly</p>
  <h1>Launch checklist</h1>
  <p class="lead">What is left before the doors open. Tick things off as they land.</p>
  <div class="bar"><i id="bar"></i></div>
  <p class="count" id="count"></p>
  <h2>The site</h2>
  <ul>
    <li><label><input type="checkbox" checked><span>Pricing page on staging</span></label></li>
    <li><label><input type="checkbox" checked><span>Three plans named</span></label></li>
    <li><label><input type="checkbox"><span>Pick the hero for the landing page</span><small>waits for you</small></label></li>
    <li><label><input type="checkbox"><span>Mobile hero</span></label></li>
  </ul>
  <h2>The app</h2>
  <ul>
    <li><label><input type="checkbox" checked><span>Today screen</span></label></li>
    <li><label><input type="checkbox" checked><span>First load under 100 kB</span></label></li>
    <li><label><input type="checkbox"><span>Onboarding, three steps</span></label></li>
    <li><label><input type="checkbox"><span>Morning reminder at 8:00</span></label></li>
    <li><label><input type="checkbox"><span>Sunday summary e-mail</span><small>waits for you</small></label></li>
  </ul>
</main>
<script>
  const boxes = [...document.querySelectorAll('input')]
  const show = () => { const n = boxes.filter(b => b.checked).length; document.getElementById('bar').style.width = `${100 * n / boxes.length}%`; document.getElementById('count').textContent = `${n} of ${boxes.length} done` }
  boxes.forEach(b => b.addEventListener('change', show)); show()
</script>
</html>
