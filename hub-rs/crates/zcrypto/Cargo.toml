[package]
name = "zcrypto"
version = "1.0.0"
edition.workspace = true
publish = false
description = "The Trommi wire format (shared/crypto/FORMAT.md): what the hub verifies, and the primitives the vectors check"

[dependencies]
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
aes-gcm = "0.10"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
indexmap = "2"

[dev-dependencies]
serde_json = "1"
