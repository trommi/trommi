[package]
name = "trommi-hub"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "The Trommi hub for protocol v2: MLS delivery service and store. Holds no key, reads no content."

[lib]
name = "trommi_hub"
path = "src/lib.rs"

[[bin]]
name = "trommi-hub"
path = "src/main.rs"

[dependencies]
openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_traits = { workspace = true }
openmls_memory_storage = { workspace = true }
tls_codec = "=0.5.0"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal", "fs", "io-util"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
hmac = "=0.12.1"
hkdf = "=0.12.4"
subtle = "=2.6.1"
base64 = "=0.22.1"
getrandom = "=0.2.17"
argon2 = "=0.5.3"
p256 = { version = "=0.13.2", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "http2"] }
aes-gcm = "=0.10.3"
chacha20poly1305 = "=0.10.1"

[dev-dependencies]
openmls_basic_credential = { workspace = true }
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "client-legacy", "http1"] }
ed25519-dalek = "=2.2.0"
