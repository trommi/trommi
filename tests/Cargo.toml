[package]
name = "trommi-tests"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Scenario, conformance and crash tests of Trommi's protocol core, against an in-memory hub."

[lib]
path = "src/lib.rs"

[dependencies]
trommi-core = { path = "../core", features = ["vectors"] }
serde_json = "=1.0.151"

[[test]]
name = "core_groups_founding"
path = "core/groups_founding.rs"

[[test]]
name = "core_store"
path = "core/store.rs"

[[test]]
name = "core_rules"
path = "core/rules.rs"

[[test]]
name = "core_profile"
