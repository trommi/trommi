[package]
name = "trommi-tests"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Scenario, conformance and crash tests of Trommi's protocol core, against an in-memory hub."

[lib]
path = "src/lib.rs"

[dependencies]
trommi-core = { path = "../core", features = ["vectors"] }
serde_json = "=1.0.151"
# OpenMLS itself, for the member of `src/forge.rs` that builds what no device builds.
openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_traits = { workspace = true }
tls_codec = "=0.5.0"
# The facade both bindings share, for the tests of the bindings (`bindings/`).
trommi-core-swift = { path = "../core/swift" }
# the hub and what its test clients need (tests/hub/…)
trommi-hub = { path = "../hub" }
# the hub's updater and what its tests sign with (tests/deploy/…); ed25519-dalek also makes the throwaway release
# key of tests/connector/update.rs
trommi-hub-updater = { path = "../hub/updater" }
ed25519-dalek = "=2.2.0"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "sync", "time", "macros", "process", "io-util"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
sha2 = "=0.10.9"
chacha20poly1305 = "=0.10.1"
aes-gcm = "=0.10.3"
p256 = { version = "=0.13.2", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
# The connector's tests (tests/connector/…): the crate itself, and what its end-to-end tests drive it with.
trommi-connector = { path = "../connector" }
reqwest = { version = "=0.12.28", default-features = false }

[[test]]
name = "core_groups_founding"
