[package]
name = "trommi-tests"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Scenario, conformance and crash tests of Trommi's protocol core, against an in-memory hub."

[lib]
path = "src/lib.rs"

[dependencies]
trommi-core = { path = "../core", features = ["vectors"] }
# The facade both bindings share, for the tests of the bindings (`bindings/`).
trommi-core-swift = { path = "../core/swift", features = ["stand-in-recovery"] }
serde_json = "=1.0.151"
# OpenMLS itself, for the member of `src/forge.rs` that builds what no device builds.
openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_traits = { workspace = true }
tls_codec = "=0.5.0"

[[test]]
name = "core_groups_founding"
path = "core/groups_founding.rs"

[[test]]
name = "core_store"
path = "core/store.rs"

[[test]]
name = "core_rules"
path = "core/rules.rs"

[[test]]
name = "core_profile"
path = "core/profile.rs"

[[test]]
name = "core_groups_session"
path = "core/groups_session.rs"

[[test]]
name = "core_groups_history"
path = "core/groups_history.rs"

[[test]]
name = "core_groups_removal"
path = "core/groups_removal.rs"

[[test]]
name = "core_groups_takeover"
path = "core/groups_takeover.rs"

[[test]]
name = "core_groups_helper"
path = "core/groups_helper.rs"

[[test]]
name = "core_groups_concurrency"
path = "core/groups_concurrency.rs"

[[test]]
name = "core_vectors"
path = "core/vectors.rs"

[[test]]
name = "core_groups_observer"
path = "core/groups_observer.rs"

[[test]]
name = "core_groups_refusals"
path = "core/groups_refusals.rs"

[[test]]
name = "core_groups_crash"
path = "core/groups_crash.rs"

[[test]]
name = "core_groups_storage"
path = "core/groups_storage.rs"

[[test]]
name = "core_groups_lifetimes"
path = "core/groups_lifetimes.rs"

[[test]]
name = "core_groups_cost"
path = "core/groups_cost.rs"

[[test]]
