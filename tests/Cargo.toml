# Every test of the repository lives in this one crate, in a folder per part. This file lists the hub's targets
# (tests/hub/…); the core's (tests/core/…) are added beside them.
[package]
name = "trommi-tests"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
trommi-hub = { path = "../hub" }
openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_traits = { workspace = true }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "sync", "time"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde_json = "1"
sha2 = "=0.10.9"
chacha20poly1305 = "=0.10.1"
aes-gcm = "=0.10.3"
p256 = { version = "=0.13.2", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }

[[test]]
name = "hub_delivery"
path = "hub/delivery.rs"

[[test]]
name = "hub_content"
path = "hub/content.rs"

[[test]]
name = "hub_accounts"
path = "hub/accounts.rs"

[[test]]
name = "hub_files_push"
path = "hub/files_push.rs"

[[test]]
name = "hub_time"
path = "hub/time.rs"

[[test]]
name = "hub_load"
path = "hub/load.rs"

[[test]]
name = "hub_units"
path = "hub/units.rs"

[[test]]
name = "hub_recovery"
path = "hub/recovery.rs"
