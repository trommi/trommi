# The App Store build of TrommiApp for Xcode: .github/workflows/ios-beta.yml generates Trommi.xcodeproj from this with
# XcodeGen (`xcodegen generate --spec project.yml`; the project is not checked in) and archives it with the official
# Xcode. The app itself is the SwiftPM package one folder up (the same one `xtool dev` builds on Linux); this target
# only links its library product and adds what a store build needs: the app icon, the production push entitlement and
# the Info.plist keys xtool writes for its own builds. app/ios/README.md "TestFlight from CI".
#
# The package builds the Rust core from sources that are not in the repository: run core/swift/build.sh before
# generating or building this project (app/ios/README.md "The Rust core"). Not yet usable as it stands on a Mac: the
# package links the core by a search path to the device library (lib/ios), which is wrong for the simulator; an Apple
# host needs an XCFramework with a device and a simulator slice (app/ios/README.md "TestFlight from CI").
name: Trommi
options:
  deploymentTarget:
    iOS: "27.0"
# The store version, for the app and its extension alike (App Store processing wants them equal, ITMS-90473); the build
# number is the workflow's run number (CURRENT_PROJECT_VERSION on the command line, which reaches both targets).
settings:
  base:
    MARKETING_VERSION: "1.0.0"
packages:
  TrommiApp:
    path: ..
targets:
  # Named Trommi, not TrommiApp: the package's module is TrommiApp.
  Trommi:
    type: application
    platform: iOS
    sources:
      - path: Link.swift
      - path: Assets.xcassets
      # The privacy manifest belongs at the root of the app bundle (xtool.yml `resources:` does the same on Linux).
      - path: ../Sources/TrommiApp/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: TrommiApp
        product: TrommiApp
      # The app extensions, embedded in PlugIns/
      - target: TrommiShareExtension
      - target: TrommiNotifyExtension
      - target: TrommiLiveExtension
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: Trommi
        PRODUCT_BUNDLE_IDENTIFIER: com.trommi.ios
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: TrommiApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The package's Info.plist (display name, camera text) plus the keys xtool adds to its builds.
        INFOPLIST_FILE: ../Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  # The Share Extension (the package's TrommiShare library; Sources/TrommiShare): Trommi in the share sheet. It shares
  # the App Group group.com.trommi.ios with the app (the encrypted inbox, ShareInbox), nothing else.
  TrommiShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareLink.swift
    dependencies:
      - package: TrommiApp
        product: TrommiShare
    settings:
      base:
        PRODUCT_NAME: TrommiShare
        # the package module is TrommiShare already; this target only links it
        PRODUCT_MODULE_NAME: TrommiShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.trommi.ios.share
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: TrommiShare.entitlements
        INFOPLIST_FILE: ../Share/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  # The Notification Service Extension (the package's TrommiNotify; Sources/TrommiNotify): the card's title in a push,
  # decrypted on the phone with the sealed context of the App Group (PushNotify).
  TrommiNotifyExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: NotifyLink.swift
    dependencies:
      - package: TrommiApp
        product: TrommiNotify
    settings:
      base:
        PRODUCT_NAME: TrommiNotify
        PRODUCT_MODULE_NAME: TrommiNotifyExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.trommi.ios.notify
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: TrommiNotify.entitlements
        INFOPLIST_FILE: ../Notify/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  # The Live Activity's widget (the package's TrommiLive; Sources/TrommiLive, its @main WidgetBundle).
  TrommiLiveExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveLink.swift
    dependencies:
      - package: TrommiApp
        product: TrommiLive
    settings:
      base:
        PRODUCT_NAME: TrommiLive
        PRODUCT_MODULE_NAME: TrommiLiveExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.trommi.ios.live
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: TrommiLive.entitlements
        INFOPLIST_FILE: ../Live/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
