# The Rust workspace: one core for the web app (WASM), the iOS app (static library, Swift through UniFFI) and the
# connector. Every dependency is pinned: exact versions here for OpenMLS and its providers, the committed Cargo.lock for
# the rest (build with --locked), the compiler in rust-toolchain.toml.
[workspace]
resolver = "2"
members = ["core", "core/wasm", "core/swift", "core/swift/bindgen", "tests"]

[workspace.package]
edition = "2021"
license-file = "LICENSE.md"
publish = false

[workspace.dependencies]
# OpenMLS and its provider crates are pinned to exact versions: an upgrade is a deliberate change of this file.
openmls = { version = "=0.9.1", default-features = false }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
openmls_memory_storage = "=0.6.0"

[profile.release]
lto = true
codegen-units = 1

# The browser build: small before fast.
[profile.wasm]
inherits = "release"
opt-level = "s"
strip = true
